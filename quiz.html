<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>做题</title>
<link rel="stylesheet" href="style.css?v=1792731582">
<style>.symk{display:flex;gap:6px;margin-top:6px}.symk button{width:auto;flex:0 0 auto;min-width:40px;padding:6px 10px;font-size:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px}</style>
</head><body><div class="w">
<a class="back" id="back" href="./">← 回到任务</a>
<h1 id="title">加载中…</h1>
<p class="s" id="intro"></p>
<div id="study"></div>
<div id="qs"></div>
<div id="bar" class="bar"><button class="main" id="submit">交卷</button></div>
<div id="result"></div>
</div>
<script src="common.js?v=1792731582"></script>
<script>
// ===== 通用做题引擎 =====
// 题库放在 data/<id>.js，用 quiz.html?s=<id> 打开。
// 题型：mc 单选（opts + a 为正确选项序号）；fill 填空（a 为答案或答案数组）。
// set.mode = 'diag' 时只摸底不要求订正；否则错题要重做到累计正确率 ≥ 80%。
const id = new URLSearchParams(location.search).get('s');
const KEY = 'quiz-' + id, DAY = new URLSearchParams(location.search).get('d');
if (DAY) document.getElementById('back').href = './?d=' + DAY;
let SET, state, mode = 'all', start = Date.now(), practice = false;

// 错题复习：quiz.html?s=review-<日期>，把错题从各自的题库里拿出来拼成一套
async function loadReview(){
  const D = id.slice(7), list = reviewList(D), m = load('mistakes', []);
  const fixed = load('reviewList', {}); if (!fixed[D] && list.length){ fixed[D] = list; save('reviewList', fixed); }
  const need = [...new Set(list.map(k => m[k].s))], sets = {};
  for (const s of need) await new Promise(r => { const sc = document.createElement('script'); sc.src = 'data/' + s + '.js?v=' + Date.now(); sc.onload = () => { sets[s] = window.SET; r(); }; sc.onerror = r; document.body.appendChild(sc); });
  const qs = [], passages = {}, passagesCn = {};
  list.forEach(k => { const x = m[k], S2 = sets[x.s]; if (!S2 || !S2.qs[x.i]) return;
    const q = {...S2.qs[x.i], src: k, sec: S2.title};
    if (q.p){ const pk = x.s + ':' + q.p; passages[pk] = S2.passages[q.p]; if (S2.passagesCn) passagesCn[pk] = S2.passagesCn[q.p]; q.p = pk; }
    qs.push(q); });
  SET = {title: '复习错题', intro: '前几天第一遍做错的题，再做一遍。<b>做对的题就从错题本里划掉</b>，错的下次还会出现。到 80% 算完成。', sections: [...new Set(qs.map(q => q.sec))], passages, passagesCn, qs};
  if (!qs.length){ document.getElementById('title').textContent = '没有要复习的错题 🎉'; return; }
  init();
}
function loadSet(){
  if (id.startsWith('review-')) return loadReview();
  const sc = document.createElement('script');
  sc.src = 'data/' + id + '.js?v=' + Date.now();
  sc.onload = () => { SET = window.SET; init(); };
  sc.onerror = () => { document.getElementById('title').textContent = '找不到这套题'; };
  document.body.appendChild(sc);
}
function get(){ try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } }
function put(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
function symIns(i, k){ const el = document.getElementById('in' + i), a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a; el.setRangeText(k, a, b, 'end'); el.focus(); el.dispatchEvent(new Event('input')); }
// pi / 根号 / sqrt 也算对：统一换成 π、√ 再比较
const norm = s => String(s).replace(/pi|Pi|PI/g,'π').replace(/根号|sqrt/gi,'√').replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/\s+/g,'').replace(/[*×·](?=[√π(])/g,'').replace(/√\((\d+)\)/g,'√$1').replace(/，/g,',').replace(/．/g,'.').replace(/[−—–]/g,'-').replace(/（/g,'(').replace(/）/g,')').replace(/^x=/,'').toLowerCase();

function awayBadge(){
  const r = load('qstart', {})[id]; if (!r) return;
  let b = document.getElementById('awayb'); if (!b){ b = document.createElement('div'); b.id = 'awayb'; b.style.cssText = 'position:fixed;top:8px;right:8px;z-index:20;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)'; document.body.appendChild(b); }
  b.textContent = `中途离开 ${r.away} 次` + (r.away > 3 ? ' ⚠️ 会告诉姐姐' : '（超过 3 次会告诉姐姐）');
  if (r.away > 3) b.style.background = 'var(--bad-soft)';
}
document.addEventListener('visibilitychange', () => {
  if (!state || state.first !== null || practice) return;
  const QS = load('qstart', {}), r = QS[id]; if (!r) return; r.segs = r.segs || [];
  if (document.visibilityState === 'hidden'){ r.away++; r.segs.push([Date.now(), null]); }
  else { const g = r.segs[r.segs.length - 1]; if (g && !g[1]) g[1] = Date.now(); }
  save('qstart', QS); awayBadge();
});
// 离开的时间段：14:02–14:05（3 分钟）
const hhmm = t => new Date(t).toTimeString().slice(0, 5);
function awayText(r){
  const segs = (r.segs || []).map(([a, b]) => [a, b || Date.now()]);
  if (!segs.length) return '';
  const tot = Math.round(segs.reduce((x, [a, b]) => x + (b - a), 0) / 60000);
  return `\n🚪 中途离开 ${segs.length} 次，共 ${tot} 分钟${segs.length > 3 ? ' ⚠️' : ''}：` + segs.slice(0, 8).map(([a, b]) => `${hhmm(a)}–${hhmm(b)}（${Math.max(0, Math.round((b - a) / 60000))} 分）`).join('、') + (segs.length > 8 ? ' 等' : '');
}
function init(){
  document.title = SET.title;
  document.getElementById('title').textContent = SET.title;
  document.getElementById('intro').innerHTML = SET.intro || '';
  state = get() || { right: {}, first: null, firstTime: null, done: false };
  if (state.first !== null) { mode = 'review'; showResult(); }
  // 第一次做：从第一次打开算时间，中途切出去（看别的页面、别的 App）记一次
  if (state.first === null){
    const QS = load('qstart', {}); if (!QS[id]){ QS[id] = {t: Date.now(), away: 0}; save('qstart', QS); }
    awayBadge();
  }
  renderStudy();
  render();
}

// 听力：SET.audio 录音地址；SET.transcript / transcriptCn 原文和翻译，交卷后才能看
function renderAudio(){
  if (!SET.audio) return;
  const done = state.first !== null || document.body.classList.contains('submitted');
  const tr = done && SET.transcript ? `<details class="tr"><summary>📄 看原文</summary><div class="passage" style="margin-top:8px">${SET.transcript}</div>${SET.transcriptCn ? `<details class="tr"><summary>看中文翻译</summary><div style="margin-top:6px;color:var(--soft)">${SET.transcriptCn}</div></details>` : ''}</details>` : '';
  document.getElementById('study').innerHTML = `<div class="c"><b>🎧 录音</b><audio controls preload="auto" src="${SET.audio}" style="width:100%;margin-top:8px"></audio>
    <div class="speed">速度：${[0.75, 0.9, 1].map(r => `<button onclick="setRate(${r},this)" class="${r === 1 ? 'on' : ''}">${r}×</button>`).join('')}</div>
    ${done ? tr : '<div class="s" style="margin:6px 0 0">原文交卷后才能看。</div>'}</div>`;
}
function setRate(r, b){ const a = document.querySelector('#study audio'); if (a){ a.playbackRate = r; a.defaultPlaybackRate = r; } document.querySelectorAll('.speed button').forEach(x => x.classList.toggle('on', x === b)); }
function renderStudy(){
  if (SET.audio) return renderAudio();
  if (!SET.study) return;
  const html = SET.study.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '<span class="vw" onclick="this.classList.toggle(\'show\');say(\'$1\')">$1<em>$2</em></span>');
  const ready = state.studied || state.first !== null;
  const card = `<div class="c passage">${SET.studyTitle ? '<b>' + SET.studyTitle + '</b><br><br>' : ''}${html}</div>`;
  let h;
  if (!ready) h = card + `<button class="main" onclick="state.studied=true;put(state);renderStudy();render()">读完了，开始测试 →</button>`;
  else if (state.first === null) h = `<div class="bar-msg">📖 第一次测试先靠自己回想（这样记得最牢）。交卷后订正时可以打开文章找答案。</div>`;
  else h = `<details class="c" ${mode === 'redo' ? 'open' : ''}><summary><b>📖 打开文章</b></summary></details>`.replace('</summary></details>', '</summary>' + card + '</details>');
  document.getElementById('study').innerHTML = h;
}
// 发音：指定正常的英语人声，排除苹果自带的搞怪音色
const FUNNY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Sandy|Shelley|Eddy|Flo|Reed/i;
const GOOD = ['Samantha','Ava','Allison','Susan','Zoe','Nicky','Daniel','Karen','Moira','Tessa','Alex','Google US English','Google UK English Female'];
function pickVoice(){
  const vs = (speechSynthesis.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang) && !FUNNY.test(v.name));
  for (const g of GOOD){ const v = vs.find(v => v.name.startsWith(g)); if (v) return v; }
  return vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch(e){}
function say(w){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w), v = pickVoice(); if (v) u.voice = v; u.lang = v ? v.lang : 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch(e){} }
function sayAll(){ const t = (SET.studyTitle || '') + '. ' + SET.study.replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, '$1').replace(/<[^>]+>/g, ' '); say(t); }
function render(){
  if (SET.study && !state.studied && state.first === null){ document.getElementById('qs').innerHTML = ''; document.getElementById('bar').style.display = 'none'; return; }
  const list = SET.qs.map((q,i)=>({q,i})).filter(({i}) => mode==='all' || (mode==='redo' && !state.right[i]));
  let lastP = null, h = '';
  for (const {q,i} of list){
    if (q.p && q.p !== lastP){ const cn = SET.passagesCn && SET.passagesCn[q.p]; h += `<div class="c passage">${SET.passages[q.p]}${cn ? `<details class="cn"><summary>看中文翻译</summary>${cn}</details>` : ''}</div>`; }
    lastP = q.p;
    h += `<div class="c q" id="q${i}"><div class="qn">${i+1}. ${q.q}</div>`;
    if (q.t === 'fill'){
      h += `<input class="fill" id="in${i}" autocomplete="off" autocapitalize="off" placeholder="填写答案（单词要写完整，包括首字母）">`;
      // 答案里有 π、√ 这些符号：给一排按钮点出来（iPad 键盘打不出来）
      if (/[π√²³°]/.test([].concat(q.a).join('') + q.q)) h += `<div class="symk">${['π','√','²','³','°','−','/'].map(k => `<button type="button" onclick="symIns(${i},'${k}')">${k}</button>`).join('')}</div>`;
    }
    else h += q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="r${i}" value="${j}"> <span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('');
    h += `<div class="ex" id="ex${i}"></div></div>`;
  }
  document.getElementById('qs').innerHTML = mode==='review' ? '' : h;
  document.getElementById('bar').style.display = mode==='review' ? 'none' : 'block';
  document.getElementById('submit').textContent = mode==='redo' ? '提交订正' : '交卷';
  window._list = list.map(x=>x.i);
  if (mode !== 'review'){
    const dr = load('qdraft-' + id, {});
    for (const i of window._list){
      const q = SET.qs[i];
      if (q.t === 'fill'){ const el = document.getElementById('in'+i); if (dr[i] != null) el.value = dr[i]; el.oninput = () => { const d = load('qdraft-' + id, {}); d[i] = el.value; save('qdraft-' + id, d); }; }
      else document.querySelectorAll(`input[name="r${i}"]`).forEach(r => { if (dr[i] != null && +r.value === dr[i]) r.checked = true; r.onchange = () => { const d = load('qdraft-' + id, {}); d[i] = +r.value; save('qdraft-' + id, d); }; });
    }
  }
}

function check(i){
  const q = SET.qs[i];
  if (q.t === 'fill'){
    const v = norm(document.getElementById('in'+i).value);
    return [].concat(q.a).some(a => norm(a) === v);
  }
  const r = document.querySelector(`input[name="r${i}"]:checked`);
  return !!r && +r.value === q.a;
}

document.getElementById('submit').onclick = () => {
  const ids = window._list;
  const blank = ids.filter(i => SET.qs[i].t==='fill' ? !document.getElementById('in'+i).value.trim() : !document.querySelector(`input[name="r${i}"]:checked`));
  if (blank.length && !confirm(`还有 ${blank.length} 道没做，确定交卷吗？`)) return;
  let ok = 0;
  for (const i of ids){
    const good = check(i); if (good){ ok++; state.right[i] = true; }
    const q = SET.qs[i], box = document.getElementById('q'+i), ex = document.getElementById('ex'+i);
    box.classList.add(good ? 'good' : 'badq');
    const ans = q.t==='fill' ? [].concat(q.a)[0] : String.fromCharCode(65+q.a)+'. '+q.opts[q.a];
    ex.innerHTML = (good ? '✅ 正确' : `❌ 正确答案：<b>${ans}</b>`) + (q.e ? `<br>💡 ${q.e}` : '');
    ex.style.display = 'block';
    box.querySelectorAll('input').forEach(x=>x.disabled = true);
  }
  try { localStorage.removeItem('qdraft-' + id); } catch(e){}
  // 每一次提交都记一笔
  const score = Math.round(ok / ids.length * 100);
  state.attempts = state.attempts || [];
  state.attempts.push({d: new Date().toLocaleString('zh-CN'), s: score, n: ids.length, k: practice ? '再刷' : mode === 'redo' ? '订正' : '第一次', m: Math.round((Date.now()-start)/60000)});
  if (practice){
    practice = false; put(state);
    notify(`🔁 ${SET.title} 再刷一遍：${score}%`);
    document.body.classList.add('submitted'); document.getElementById('bar').style.display = 'none';
    if (SET.audio) renderAudio(); showResult(true); scrollTo({top:0, behavior:'smooth'}); return;
  }
  if (state.first === null){
    // 第一遍做错的题记进错题本（摸底不记）
    state.wrong = ids.filter(i => !state.right[i]).map(i => i + 1);
    if (SET.mode !== 'diag' && !id.startsWith('review-')) addMistakes(id, ids.filter(i => !state.right[i]));
    state.first = Math.round(ok / SET.qs.length * 100);
    const QS = load('qstart', {}), qr = QS[id] || {t: start, away: 0};
    state.firstTime = Math.round((Date.now() - qr.t)/60000); state.away = qr.away; state.awayTxt = awayText(qr); state.t0 = hhmm(qr.t);
    delete QS[id]; save('qstart', QS); const ab = document.getElementById('awayb'); if (ab) ab.remove();
    state.date = new Date().toLocaleString('zh-CN');
    if (SET.sections) state.sec = SET.sections.map(s => {
      const idx = SET.qs.map((q,i)=>i).filter(i=>SET.qs[i].sec===s);
      return [s, idx.filter(i=>state.right[i]).length, idx.length];
    });
  }
  // 复习时做对的题，从错题本划掉
  if (id.startsWith('review-')){ const m = load('mistakes', []); ids.forEach(i => { if (state.right[i] && SET.qs[i].src != null && m[SET.qs[i].src]) m[SET.qs[i].src].ok = true; }); save('mistakes', m); }
  const total = Object.keys(state.right).length;
  state.now = Math.round(total / SET.qs.length * 100);
  const wasDone = state.done;
  state.done = SET.mode === 'diag' || state.now >= 80;
  put(state);
  if (mode !== 'redo') notify(`📝 ${SET.title}：第一次 ${state.first}%，用时 ${state.firstTime} 分钟（${state.t0 || ''}–${hhmm(Date.now())}）` + (state.sec ? '（' + state.sec.map(([n,a,b])=>n+' '+a+'/'+b).join('，') + '）' : '') + (state.awayTxt || (state.away === 0 ? '\n🚪 中途没离开' : '')) + (state.wrong && state.wrong.length ? `\n❌ 错题：第 ${state.wrong.join('、')} 题（已记进错题本，下次复习）` : ''));
  else if (state.done && !wasDone) notify(`✅ ${SET.title} 订正完成，现在 ${state.now}%`);
  document.body.classList.add('submitted');
  document.getElementById('bar').style.display = 'none';
  if (SET.audio) renderAudio();
  showResult(true);
  scrollTo({top:0, behavior:'smooth'});
};

function showResult(fresh){
  const s = state, need = SET.mode !== 'diag' && !s.done;
  let h = `<div class="c res"><div class="big">${SET.mode==='diag' ? s.first+'%' : s.now+'%'}</div>
    <div>${SET.title}</div>
    <div class="s">第一次：${s.first}% · 用时 ${s.firstTime} 分钟 · ${s.date}</div>`;
  if (s.sec) h += '<div class="secs">' + s.sec.map(([n,a,b])=>`<span>${n}：${a}/${b}</span>`).join('') + '</div>';
  h += s.done ? `<div class="okmsg">✅ 完成！截图这一页发给姐姐</div>`
              : `<div class="badmsg">还没到 80%，看完解析后重做错题</div>`;
  if (s.attempts && s.attempts.length) h += '<div class="att"><b>做题记录</b>' + s.attempts.map((a,i) => `<div>${i+1}. ${a.k} · ${a.s}%${a.n < SET.qs.length ? '（' + a.n + ' 题）' : ''} · ${a.m} 分钟 · ${a.d}</div>`).join('') + '</div>';
  h += '</div>';
  if (need) h += `<button class="main" onclick="redo()">重做错题</button>`;
  else h += `<button class="ghost" onclick="again()">🔁 再刷一遍（不影响第一次的成绩）</button>`;
  if (fresh) h += `<p class="s" style="text-align:center">往下看每道题的解析 ↓</p>`;
  else h += `<button class="ghost" onclick="mode='all';document.getElementById('result').innerHTML='';renderReview()">查看全部题目和解析</button>`;
  document.getElementById('result').innerHTML = h;
  document.getElementById('result').scrollIntoView();
}
function again(){ practice = true; setTimeout(renderStudy); start = Date.now(); document.body.classList.remove('submitted'); mode='all'; document.getElementById('result').innerHTML=''; render(); scrollTo({top:0}); }
function redo(){ document.body.classList.remove('submitted'); mode='redo'; setTimeout(renderStudy); document.getElementById('result').innerHTML=''; render(); scrollTo({top:0}); }
function renderReview(){
  render();
  for (const i of window._list){
    const q=SET.qs[i], ex=document.getElementById('ex'+i);
    const ans = q.t==='fill' ? [].concat(q.a)[0] : String.fromCharCode(65+q.a)+'. '+q.opts[q.a];
    ex.innerHTML = `答案：<b>${ans}</b>` + (q.e ? `<br>💡 ${q.e}` : ''); ex.style.display='block';
    document.getElementById('q'+i).querySelectorAll('input').forEach(x=>x.disabled=true);
  }
  document.getElementById('bar').style.display='none';
  document.body.classList.add('submitted');
}
loadSet();
</script></body></html>
