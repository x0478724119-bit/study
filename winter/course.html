<div id="nav"></div>
<div class="wrap narrow" id="main"></div>
<script>
W.nav();
(function () {
  var c = W.course(W.q('c')) || W.COURSES[0], ids = W.ofCourse(c.id), m = document.getElementById('main');
  var h = '<div class="ahead"><div class="note"><a href="index.html">首页</a> › ' + c.name + '</div>' +
    '<h1 style="color:' + c.color + '">' + c.name + '</h1><div class="note">' + c.code + ' · ' + W.CONFIG.TERM + '</div></div>' +
    '<p>' + W.esc(c.intro) + '</p>' +
    '<div class="tip"><b>这门课怎么算分：</b>' + ids.map(function (id) { return W.A[id].no + ' ' + W.A[id].weight + '%'; }).join(' + ') +
    ' = 100 分。不用学新内容，全部用你九上已经学过的东西。不会的先自己查（课本、网上、问 AI，按每项作业的 AI 等级来），查到的要注明出处。</div>' +
    '<h3>作业</h3><div class="alist">' + ids.map(function (id) { return W.aRow(id); }).join('') + '</div>';
  m.innerHTML = h; document.title = c.name + ' · 寒假大作业';
})();
</script>
