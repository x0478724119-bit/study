<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习站">
<title>学习站</title>
<link rel="stylesheet" href="style.css?v=1791731509">
</head><body class="app">
<header class="top">
  <div class="brand"><div class="logo">🏠</div><div><b>我的设计工作室</b><small id="lv"></small></div></div>
  <div class="coins">🪙 <span id="coin">0</span></div>
</header>
<div class="w" id="view"></div>
<nav class="tabs">
  <button data-t="today" class="on"><span>✅</span>今日</button>
  <button data-t="jobs"><span>📋</span>接单</button>
  <button data-t="book"><span>📘</span>手册</button>
  <button data-t="me"><span>👤</span>我的</button>
</nav>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="common.js?v=1791731509"></script>
<script>
const LEVELS = [
  {lv:1, name:'设计学徒', need:0, icon:'🌱'},
  {lv:2, name:'初级设计师', need:200, icon:'✏️'},
  {lv:3, name:'设计师', need:600, icon:'🎨'},
  {lv:4, name:'主设计师', need:1500, icon:'🏆'},
  {lv:5, name:'工作室老板', need:3000, icon:'👑'},
];
const level = e => LEVELS.filter(l => e >= l.need).pop();
const nextLevel = e => LEVELS.find(l => l.need > e);
let tab = 'today';
const $ = s => document.querySelector(s);
const T = dayStr();  // 一天从早上 6 点开始算，凌晨还没睡算前一天
const isWeekend = d => [0,6].includes(new Date(d + 'T12:00').getDay());

// 加载数据文件（加时间戳，保证拿到最新的）
function loadScript(src){ return new Promise(r => { const s = document.createElement('script'); s.src = src + '?v=' + Date.now(); s.onload = r; s.onerror = r; document.body.appendChild(s); }); }
Promise.all([loadScript('data/days.js'), loadScript('data/jobs.js'), loadScript('data/pause.js')]).then(() => { checkMissed(); render(); });

// 过去的工作日没做完：按没做完的项数扣金币（每天只结算一次）；补完按天数退还
const paused = k => (window.PAUSE || []).find(p => k >= p.from && k <= p.to);
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
function checkMissed(){
  const missed = load('missed', {}), leave = load('leave', {}), start = load('start', null) || (save('start', T), T);
  for (const k of Object.keys(DAYS || {})){
    if (k >= T || k < start || isWeekend(k) || paused(k) || missed[k] || dayComplete(k)) continue;
    if (leave[k] && daysBetween(k, T) <= CONFIG.STALE) continue;
    const left = DAYS[k].tasks.filter((t,i) => !taskDone(k, i, t)).length, pen = left * CONFIG.MISS;
    const lv = !!leave[k];
    missed[k] = {pen, back: lv ? -1 : 0}; save('missed', missed);
    addCoins(-pen, `${DAYS[k].name} ${lv ? '请假超过 ' + CONFIG.STALE + ' 天没补' : '有 ' + left + ' 项没完成'}`);
    notify(`⚠️ ${k} ${DAYS[k].name} ${lv ? '请假超过 ' + CONFIG.STALE + ' 天还没补' : '有 ' + left + ' 项没完成'}，扣 ${pen} 金币`);
  }
  // 补完了：按晚了几天退还
  for (const [k, m] of Object.entries(missed)){
    if (typeof m !== 'object' || m.back || !DAYS[k] || !dayComplete(k)) continue;
    const late = daysBetween(k, T), back = Math.round(m.pen * Math.max(0, 1 - CONFIG.REFUND * late));
    m.back = back || -1; save('missed', missed);
    if (back) addCoins(back, `补完 ${DAYS[k].name}，退还`);
    notify(`📚 补完了 ${k} ${DAYS[k].name}` + (back ? `，退还 ${back} 金币` : '（太晚了，不退金币）'));
    toast(back ? `补完了，退还 ${back} 金币` : '补完了');
  }
}
// 欠着的作业：过去的工作日（含请假）还没做完
function backlog(){ const start = load('start', T); return Object.keys(DAYS || {}).filter(k => k < T && k >= start && !isWeekend(k) && !paused(k) && !dayComplete(k)).sort(); }
function stale(){ return backlog().filter(k => daysBetween(k, T) > CONFIG.STALE); }
// 每周一推送上周周报（只推一次）
function weekly(){
  const d = new Date(T + 'T12:00'), mon = new Date(d - ((d.getDay() + 6) % 7) * 864e5), lastMon = todayStr(new Date(mon - 7 * 864e5)), lastSun = todayStr(new Date(mon - 864e5));
  const sent = load('weekly', null); if (sent === lastMon) return;
  const start = load('start', T); if (lastSun < start) { save('weekly', lastMon); return; }
  const days = Object.keys(DAYS || {}).filter(k => k >= lastMon && k <= lastSun && k >= start && !isWeekend(k) && !paused(k));
  if (!days.length) { save('weekly', lastMon); return; }  // 整周放假 / 没任务就不发
  const missed = load('missed', {}), leave = load('leave', {});
  const onTime = days.filter(k => dayComplete(k) && !missed[k] && !leave[k]).length;
  const madeUp = days.filter(k => dayComplete(k) && (missed[k] || leave[k])).length;
  const owe = days.filter(k => !dayComplete(k)).length, lv = days.filter(k => leave[k]).length;
  const net = wallet().log.filter(l => l.t.slice(0, 10) >= lastMon && l.t.slice(0, 10) <= lastSun && !l.why.startsWith('兑换')).reduce((a, l) => a + l.n, 0);
  notify(`📊 周报 ${lastMon} ~ ${lastSun}：${days.length} 个学习日，按时完成 ${onTime} 天，补完 ${madeUp} 天，还欠 ${owe} 天，请假 ${lv} 次；金币净 ${net >= 0 ? '+' : ''}${net}，余额 ${wallet().coins}`);
  save('weekly', lastMon);
}
function leaveLeft(){ const m = T.slice(0, 7); return CONFIG.LEAVE - Object.keys(load('leave', {})).filter(k => k.startsWith(m)).length; }
function askLeave(){
  modal(`<h3>今天请假？</h3><p>本月还剩 <b>${leaveLeft()}</b> 次。请假后今天没做完的任务不扣金币，也不发金币。姐姐会收到通知。</p>
    <div class="row"><button class="ghost" onclick="closeM()">算了</button><button class="main" onclick="doLeave()">确定请假</button></div>`);
}
function doLeave(){ const l = load('leave', {}); l[T] = 1; save('leave', l); notify(`🙋 ${T} 请假（本月还剩 ${leaveLeft()} 次）`); closeM(); toast('已请假'); render(); }

// ===== 今日 =====
function dayKey(){ const ks = Object.keys(window.DAYS || {}).sort(); return (window.DAYS || {})[T] ? T : (ks.filter(k => k <= T).pop() || ks[0]); }
function quizState(id){ return load('quiz-' + id, null); }
function taskDone(key, i, t){ if (t.quiz){ const q = quizState(t.quiz); return !!(q && q.done); } return !!load('day-' + key, {})[i]; }
function dayComplete(key){ const d = DAYS[key]; return !!d && d.tasks.every((t,i) => taskDone(key, i, t)); }
function unlocked(){ return isWeekend(T) || !DAYS[T] || dayComplete(T); }

let selDay = null;
function viewToday(){
  const hp = paused(T);
  if (hp && !selDay) return `<div class="c" style="text-align:center;padding:36px 16px"><div style="font-size:52px">🏖️</div><h1>假期中，好好玩！</h1><p class="s">${hp.why || ''}<br>${hp.from} ~ ${hp.to}<br>这几天不用学习、不用打卡、不扣金币</p></div>`;
  const key = selDay || dayKey(), day = DAYS[key];
  const wake = load('wake', {});
  let h = '';
  // 起床打卡
  if (!isWeekend(T)){
    const wt = wake[T];
    if (wt && wt.ok === true) h += `<div class="c wake on"><b>☀️ 今天 ${wt.time} 起床打卡</b><span>+${wt.coin} 金币</span></div>`;
    else if (wt && wt.ok === 'fail') h += `<div class="c wake"><b>😴 ${wt.time} 打卡后 2 小时没开始学习，打卡作废</b></div>`;
    else if (wt) h += `<div class="c wake"><div><b>☀️ ${wt.time} 已打卡</b><div class="d">${wakeLeft(wt)} 分钟内完成第一项任务，才能拿到起床金币${wt.coin ? '（+' + wt.coin + '）' : ''}</div></div></div>`;
    else if (hm() < '06:00') h += `<div class="c wake"><div><b>🌙 现在是 ${hm()}，该睡觉啦</b><div class="d">起床打卡 06:00 开放</div></div></div>`;
    else h += `<div class="c wake"><div><b>☀️ 起床打卡</b><div class="d">14:00 前 +5 金币 · 15:00 前 +3 金币</div></div><button class="main sm" onclick="wakeUp()">我起床了</button></div>`;
  }
  const bl = backlog(), st = stale();
  if (bl.length) h += `<div class="bar-msg">📌 欠着的作业：<b>${bl.length} 天</b>${st.length ? `，其中 ${st.length} 天超过 ${CONFIG.STALE} 天（<b>不能接单、不能兑换</b>）` : ''}<br>${bl.map(k => `<a class="go" href="#" onclick="selDay='${k}';render();scrollTo(0,0);return false">去补 ${k} ${DAYS[k].name} →</a>`).join('<br>')}</div>`;
  if (!day){ return h + '<div class="c">还没有任务。</div>'; }
  const wk = ['日','一','二','三','四','五','六'][new Date(key + 'T12:00').getDay()];
  const note = key === T ? ' · 今天' : (key > T ? ' · 可以提前做，截止到这一天结束' : (DAYS[T] ? '' : ' · 今天没有新任务，这是最近一天的'));
  let n = 0;
  const rows = day.tasks.map((t,i) => {
    const on = taskDone(key, i, t); if (on) n++;
    const q = t.quiz ? quizState(t.quiz) : null;
    const wv = t.write ? load('day-' + key, {})[i] : null;
    const wbox = t.write ? (wv ? `<div class="wdone">✍️ ${esc(wv.text)}<br><small>${wv.time} 提交</small></div>` : `<textarea class="fill wbox" id="w-${key}-${i}" placeholder="${t.write}"></textarea><button class="main sm" style="margin-top:8px" onclick="submitWrite('${key}',${i})">提交</button>`) : '';
    return `<div class="c task"><div class="chk ${on?'on':''}" ${t.quiz||t.write?'':`onclick="tog('${key}',${i})"`}>${on?'✓':''}</div>
      <div><div class="t"><span class="tag t-${t.tag}">${t.tag}</span>${t.t}</div><div class="d">${t.d}</div>
      ${wbox}${t.quiz ? (q && q.first !== null && q.first !== undefined ? `<div class="d">${q.done?'✅ 已完成':'⏳ 还要订正'} · 第一次 ${q.first}%</div><a class="go" href="quiz.html?s=${t.quiz}">${q.done?'查看结果':'继续订正'} →</a>` : `<a class="go" href="quiz.html?s=${t.quiz}">开始做题 →</a>`) : ''}
      </div></div>`;
  }).join('');
  const all = n === day.tasks.length, paid = load('paid', {})[key];
  h += `<h1>${day.name}</h1><p class="s">${key} 周${wk}${note}</p>
    <div class="c"><div class="row2"><span>今日进度</span><b>${n} / ${day.tasks.length}</b></div><div class="prog"><i style="width:${n/day.tasks.length*100}%"></i></div></div>` + rows;
  // 今日汇报：一天只截这一张
  const wk2 = load('wake', {})[key], todayLog = wallet().log.filter(l => l.t.startsWith(key) && l.n > 0).reduce((a,l) => a + l.n, 0);
  h += `<div class="c report"><b>📋 今日汇报 · ${key}</b>
    <div>起床：${wk2 ? wk2.time : '未打卡'}</div>
    ${day.tasks.map((t,i) => { const q = t.quiz ? quizState(t.quiz) : null; return `<div>${taskDone(key,i,t) ? '✅' : '⬜️'} ${t.t}${q && q.first != null ? ` · 第一次 ${q.first}%${q.sec ? '（' + q.sec.map(([n,a,b]) => n + ' ' + a + '/' + b).join('，') + '）' : ''}` : ''}</div>`; }).join('')}
    <div>今天获得：🪙 ${todayLog}</div><div class="d">做完后截图这一张发给姐姐</div></div>`;
  const late = key < T, onLeave = load('leave', {})[key], miss = load('missed', {})[key];
  if (onLeave) h += `<div class="bar-msg ok">🙋 这一天请假了，不扣金币</div>`;
  else if (key === T && !isWeekend(T) && !all && leaveLeft() > 0) h += `<button class="ghost" onclick="askLeave()">今天请假（本月还剩 ${leaveLeft()} 次）</button>`;
  if (all) h += `<div class="c done-card"><b>🎉 ${late ? '补完了！' : key > T ? '提前做完了！' : '今天全部完成！'}</b>${paid ? '<div class="d">已领取 +' + CONFIG.DAILY_COIN + ' 金币，去接单吧</div>' : late ? (miss && miss.back > 0 ? '<div class="d">已退还 ' + miss.back + ' 金币</div>' : '<div class="d">补完了</div>') : `<button class="main" onclick="claimDay('${key}')">领取全勤奖励 +${CONFIG.DAILY_COIN} 金币</button>`}</div>`;
  else if (late && !onLeave) h += `<div class="bar-msg">⏰ 这一天已经过了${miss && miss.pen ? `，扣了 ${miss.pen} 金币。<b>今天补完退 ${Math.round(miss.pen * Math.max(0, 1 - CONFIG.REFUND * daysBetween(key, T)))}</b>，越晚退得越少` : '，补完不发金币'}。</div>`;
  // 往期任务：可以回去补作业、复习
  const all2 = Object.keys(DAYS).sort().reverse();
  if (all2.length > 1) h += '<h2>📅 全部任务</h2><p class="s">以后的可以提前做，过去的可以补、可以复习</p>' + all2.map(k => {
    const d = DAYS[k], m = d.tasks.filter((t,i) => taskDone(k, i, t)).length, lab = k > T ? '<span class="tag">可提前做</span>' : k === T ? '<span class="tag t-数学">今天</span>' : '';
    return `<div class="c day-row ${k === key ? 'cur' : ''}" onclick="selDay='${k}';render();scrollTo(0,0)"><span>${lab}<b>${d.name}</b><br><small>${k}</small></span><span>${m === d.tasks.length ? '✅' : m + ' / ' + d.tasks.length}</span></div>`;
  }).join('');
  return h;
}
const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function submitWrite(key, i){
  const v = document.getElementById(`w-${key}-${i}`).value.trim(), t = DAYS[key].tasks[i];
  if (v.length < (t.min || 10)){ toast(`再多写一点（至少 ${t.min || 10} 个字）`); return; }
  const d = load('day-' + key, {}); d[i] = {text: v, time: todayStr() + ' ' + hm()}; save('day-' + key, d);
  notify(`✍️ ${t.t}：\n${v}`); render();
}
function tog(key, i){ const d = load('day-' + key, {}); d[i] = !d[i]; save('day-' + key, d); render(); }
// 当天完成的任务每项 +2，一项只给一次；补的不给
function settle(){
  const got = load('taskpaid', {}); let did = false;
  for (const key of Object.keys(window.DAYS || {}).filter(k => k >= T)){
    got[key] = got[key] || {};
    DAYS[key].tasks.forEach((t, i) => {
      if (got[key][i] || !taskDone(key, i, t)) return;
      got[key][i] = 1; save('taskpaid', got); did = true;
      addCoins(CONFIG.TASK_COIN, '完成：' + t.t); toast('+' + CONFIG.TASK_COIN + ' 金币 · ' + t.t);
    });
  }
  checkWake(did);
}
const mins = t => +t.slice(0,2) * 60 + +t.slice(3,5);
function wakeLeft(wt){ return Math.max(0, 120 - (mins(hm()) - mins(wt.time))); }
function wakeUp(){
  const w = load('wake', {}); if (w[T] || hm() < '06:00' || paused(T)) return;
  const now = hm(); const rule = CONFIG.WAKE.find(([t]) => now <= t); const coin = rule ? rule[1] : 0;
  w[T] = {time: now, coin, ok: false}; save('wake', w);
  notify(`☀️ 起床打卡 ${now}（2 小时内开始学习才算数）`);
  toast('打卡成功！2 小时内完成第一项任务才有金币'); render();
}
// 打卡后：2 小时内完成了任务 → 发金币；超时没动 → 作废
function checkWake(justDid){
  const w = load('wake', {}), wt = w[T]; if (!wt || wt.ok !== false) return;
  if (justDid && wakeLeft(wt) > 0){
    wt.ok = true; save('wake', w);
    if (wt.coin) addCoins(wt.coin, '起床打卡 ' + wt.time);
    notify(`✅ ${wt.time} 起床，${mins(hm()) - mins(wt.time)} 分钟后完成第一项任务` + (wt.coin ? `，起床 +${wt.coin} 金币` : ''));
  } else if (wakeLeft(wt) === 0){
    wt.ok = 'fail'; save('wake', w);
    notify(`😴 ${wt.time} 打卡后 2 小时没开始学习，起床打卡作废`);
  }
}
function claimDay(key){
  const p = load('paid', {}); if (p[key] || key < T) return; p[key] = 1; save('paid', p);
  addCoins(CONFIG.DAILY_COIN, '完成 ' + DAYS[key].name);
  notify(`🎉 ${DAYS[key].name} 全部完成，+${CONFIG.DAILY_COIN} 金币`); toast('+' + CONFIG.DAILY_COIN + ' 金币'); render();
}

// ===== 接单 =====
const STATUS = {open:['可接单','s-open'], doing:['进行中','s-doing'], review:['待验收','s-review'], done:['已完成','s-done']};
function viewJobs(){
  const busy = Object.values(load('jobs', {})).filter(x => x === 'doing').length >= CONFIG.JOB_LIMIT;
  const debt = wallet().coins < 0, old = stale().length, ok = unlocked() && !debt && !old && !busy, js = load('jobs', {}), lv = level(wallet().earned).lv;
  let h = `<h1>接单大厅</h1><p class="s">接单 → 做作品 → 发给甲方 → 拿验收码领金币</p>`;
  h += busy ? `<div class="bar-msg">🛠️ 手上已经有 ${CONFIG.JOB_LIMIT} 单在做，提交或放弃一单后才能接新的</div>` : old ? `<div class="bar-msg">📌 有作业欠了超过 ${CONFIG.STALE} 天，补完才能接新单</div>` : debt ? `<div class="bar-msg">💸 金币是负数，先补作业把金币补回来，才能接新单</div>` : ok ? `<div class="bar-msg ok">🔓 ${isWeekend(T) ? '周末可以直接接单' : '今日任务已完成，可以接新单'}</div>` : `<div class="bar-msg">🔒 先完成今天的任务，才能接新单（进行中的单不受影响）</div>`;
  for (const j of (window.JOBS || [])){
    const st = js[j.id] || 'open', lvLock = j.minLv && lv < j.minLv;
    let b;
    if (lvLock) b = `<button class="ghost" disabled>🔒 Lv${j.minLv} 解锁</button>`;
    else if (st === 'open') b = `<button class="main" ${ok?'':'disabled'} onclick="take('${j.id}')">接单</button>`;
    else if (st === 'doing') b = `<button class="gold" onclick="submitJob('${j.id}')">我做完了，提交</button><button class="ghost" style="margin-top:0" onclick="dropJob('${j.id}')">放弃这单</button>`;
    else if (st === 'review') b = `<button class="gold" onclick="askCode('${j.id}')">输入验收码</button>`;
    else b = `<button class="ghost" disabled>✓ 已完成</button>`;
    h += `<div class="c job ${lvLock?'locked':''}"><div class="row2"><span class="tag t-${j.type}">${j.type}</span><b class="reward">🪙 ${j.reward}</b></div>
      <h3>${j.title}</h3><p class="d">${j.desc}</p><div class="meta"><span>甲方：${j.client}</span><span>⏱ ${j.days} 天</span><span>${'★'.repeat(j.stars)}${'☆'.repeat(3-j.stars)}</span><span class="${STATUS[st][1]}">● ${STATUS[st][0]}</span></div>${b}</div>`;
  }
  return h;
}
const job = id => JOBS.find(x => x.id === id);
function setJob(id, st){ const js = load('jobs', {}); js[id] = st; save('jobs', js); }
function take(id){ if (Object.values(load('jobs', {})).filter(x => x === 'doing').length >= CONFIG.JOB_LIMIT) return; setJob(id, 'doing'); notify(`📋 接单：${job(id).title}（${job(id).reward} 金币）`); toast('接单成功，加油'); render(); }
function dropJob(id){
  modal(`<h3>放弃「${job(id).title}」？</h3><p>放弃后这单回到接单大厅，以后还能再接。姐姐会收到通知。</p>
    <div class="row"><button class="ghost" onclick="closeM()">再想想</button><button class="main" onclick="setJob('${id}','open');notify('↩️ 放弃了订单：${job(id).title}');closeM();render()">确定放弃</button></div>`);
}
function submitJob(id){
  modal(`<h3>提交「${job(id).title}」</h3><p>把作品发到飞书的<b>「工作室」群</b>：第一行写订单名，再附上截图、PDF 或录屏。验收通过后，姐姐会给你一个 <b>6 位验收码</b>。</p>
    <div class="row"><button class="ghost" onclick="closeM()">再改改</button><button class="main" onclick="setJob('${id}','review');notify('📤 提交作品：${job(id).title}，等你验收');closeM();render()">已发给姐姐</button></div>`);
}
function askCode(id){
  modal(`<h3>输入验收码</h3><p>「${job(id).title}」验收通过后，姐姐会告诉你 6 位数字。</p><input id="cin" inputmode="numeric" maxlength="6" autocomplete="off">
    <div class="row"><button class="ghost" onclick="closeM()">取消</button><button class="main" onclick="checkCode('${id}')">领取 🪙 ${job(id).reward}</button></div>`);
}
function checkCode(id){
  const v = $('#cin').value.trim();
  if (fnv(v) !== job(id).h){ toast('验收码不对，再问问姐姐'); return; }
  setJob(id, 'done'); closeM(); addCoins(job(id).reward, '订单：' + job(id).title);
  notify(`✅ 订单完成：${job(id).title}，+${job(id).reward} 金币`); toast('+' + job(id).reward + ' 金币'); render();
}

// ===== 手册 =====
function viewBook(){
  return `<h1>学习手册</h1><p class="s">路线、目标学校、三年计划都在这里</p>
    <div class="c"><a class="go big" href="handbook.html">📘 打开成长手册 →</a><div class="d">从现在到上大学：要去哪、学什么、每个月做什么。</div></div>
    <div class="c"><a class="go big" href="lessons.html">🛠️ 软件教程 →</a><div class="d">酷家乐、Swift Playgrounds、可画：一课一课跟着做，每课做完都有要交的东西。</div></div>`;
}

// ===== 我的 =====
function viewMe(){
  const w = wallet(), L = level(w.earned), N = nextLevel(w.earned);
  const pct = N ? (w.earned - L.need) / (N.need - L.need) * 100 : 100;
  const jobsDone = Object.values(load('jobs', {})).filter(s => s === 'done').length;
  const days = Object.keys(load('paid', {})).length;
  let h = `<h1>我的</h1><div class="c profile"><div class="avatar">${L.icon}</div><div style="flex:1"><b class="lvname">Lv${L.lv} · ${L.name}</b>
    <div class="prog"><i style="width:${pct}%"></i></div><div class="d">${N ? `累计 ${w.earned} / ${N.need} 升到「${N.name}」` : '最高等级！'}</div></div></div>
    <div class="c stats"><div><b>${w.coins}</b><small>金币余额</small></div><div><b>${jobsDone}</b><small>完成订单</small></div><div><b>${days}</b><small>完成天数</small></div></div>
    <div class="c"><b>💰 兑换零花钱</b><div class="d">${CONFIG.RATE} 金币 = 1 元 · 现在可换 <b>${Math.floor(w.coins / CONFIG.RATE)}</b> 元</div>
    ${stale().length ? `<div class="bar-msg">📌 有作业欠了超过 ${CONFIG.STALE} 天，补完才能兑换</div>` : ''}
    <button class="gold" ${w.coins < CONFIG.RATE || stale().length ? 'disabled' : ''} onclick="cashOut()">申请兑换</button></div>
    <div class="c"><b>📜 金币记录</b>`;
  h += w.log.length ? w.log.slice(0, 30).map(l => `<div class="log"><span>${l.why}<br><small>${l.t}</small></span><b class="${l.n > 0 ? 'plus' : ''}">${l.n > 0 ? '+' : ''}${l.n}</b></div>`).join('') : '<div class="d">还没有记录</div>';
  return h + '</div>';
}
function cashOut(){
  const y = Math.floor(wallet().coins / CONFIG.RATE);
  modal(`<h3>兑换 ${y} 元</h3><p>确认后扣掉 ${y * CONFIG.RATE} 金币，截图发给姐姐，姐姐转钱给你。</p>
    <div class="row"><button class="ghost" onclick="closeM()">先攒着</button><button class="gold" onclick="doCash(${y})">确认兑换</button></div>`);
}
function doCash(y){ addCoins(-y * CONFIG.RATE, `兑换 ${y} 元零花钱`); notify(`💰 申请兑换 ${y} 元零花钱`); closeM(); toast('已申请，截图发给姐姐'); render(); }

// ===== 通用 =====
function modal(h){ $('#mbox').innerHTML = h; $('#modal').classList.add('show'); }
function closeM(){ $('#modal').classList.remove('show'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeM(); };
function render(){
  if (window.DAYS){ settle(); checkMissed(); weekly(); }
  const w = wallet(); $('#coin').textContent = w.coins; const L = level(w.earned); $('#lv').textContent = `Lv${L.lv} · ${L.name}`;
  $('#view').innerHTML = {today: viewToday, jobs: viewJobs, book: viewBook, me: viewMe}[tab]();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab === 'today') selDay = null; render(); scrollTo(0, 0); });
</script></body></html>
