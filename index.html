<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>学习站</title>
<link rel="stylesheet" href="style.css?v=1792464985">
</head><body class="app">
<header class="top">
  <div class="brand"><div class="logo" style="background:url(apple-touch-icon.png) center/cover"></div><div><b>我的设计工作室</b><small id="lv"></small></div></div>
  <div class="coins">🪙 <span id="coin">0</span></div>
</header>
<div class="w" id="view"></div>
<nav class="tabs">
  <button data-t="today" class="on"><span>✅</span>今日</button>
  <button data-t="jobs"><span>📋</span>接单</button>
  <button data-t="book"><span>📘</span>手册</button>
  <button data-t="me"><span>👤</span>我的</button>
</nav>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="common.js?v=1792464985"></script>
<script>
const LEVELS = [
  {lv:1, name:'设计学徒', need:0, icon:'🌱'},
  {lv:2, name:'初级设计师', need:200, icon:'✏️'},
  {lv:3, name:'设计师', need:600, icon:'🎨'},
  {lv:4, name:'主设计师', need:1500, icon:'🏆'},
  {lv:5, name:'工作室老板', need:3000, icon:'👑'},
];
const level = e => LEVELS.filter(l => e >= l.need).pop();
const nextLevel = e => LEVELS.find(l => l.need > e);
let tab = 'today';
const $ = s => document.querySelector(s);
const T = dayStr();  // 一天从早上 6 点开始算，凌晨还没睡算前一天
const isWeekend = d => [0,6].includes(new Date(d + 'T12:00').getDay());

// 加载数据文件（加时间戳，保证拿到最新的）
function loadScript(src){ return new Promise(r => { const s = document.createElement('script'); s.src = src + '?v=' + Date.now(); s.onload = r; s.onerror = r; document.body.appendChild(s); }); }
Promise.all([loadScript('data/days.js'), loadScript('data/jobs.js'), loadScript('data/pause.js'), loadScript('data/leave.js'), loadScript('data/adjust.js'), loadScript('data/feedback.js')]).then(() => { addReviewTasks(); save('daysCache', window.DAYS); checkMissed(); render(); });
// 错题复习：今天（或已经开始复习的那天）在最后加一项"复习错题"
function addReviewTasks(){
  const fixed = load('reviewList', {});
  for (const k of Object.keys(DAYS)){
    if (k > T || (k < T && !fixed[k])) continue;
    const n = reviewList(k).length; if (!n) continue;
    DAYS[k].tasks.push({tag: '复习', t: `复习错题（${n} 道）`, d: '约 10 分钟。前几天第一遍做错的题，再做一遍，做对了才算会了。', quiz: 'review-' + k, review: 1});
  }
}

// 过去的工作日没做完：按没做完的项数扣金币（每天只结算一次）；补完按天数退还
const okLeave = k => (window.LEAVE_OK || []).includes(k);
const paused = k => (window.PAUSE || []).find(p => k >= p.from && k <= p.to);
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
function applyAdjust(){
  const done = load('adjDone', {});
  for (const a of (window.ADJUST || [])){
    if (done[a.id]) continue; done[a.id] = 1; save('adjDone', done);
    addCoins(a.n, (a.n > 0 ? '🎁 姐姐奖励：' : '姐姐扣除：') + a.why);
    toast((a.n > 0 ? '🎁 +' : '') + a.n + ' 金币 · ' + a.why);
  }
}
function checkMissed(){
  const missed = load('missed', {}), leave = load('leave', {}), start = load('start', null) || (save('start', T), T);
  for (const k of Object.keys(DAYS || {})){
    if (k >= T || k < start || isWeekend(k) || paused(k) || okLeave(k) || missed[k] || dayComplete(k)) continue;
    if (leave[k] && daysBetween(k, T) <= CONFIG.STALE) continue;
    const undone = DAYS[k].tasks.filter((t,i) => !taskDone(k, i, t)), left = undone.length, pen = undone.reduce((a, t) => a + taskCoin(t), 0);  // 没做的每项扣它本来能拿的金币
    const lv = !!leave[k];
    missed[k] = {pen, back: lv ? -1 : 0}; save('missed', missed);
    addCoins(-pen, `${DAYS[k].name} ${lv ? '请假超过 ' + CONFIG.STALE + ' 天没补' : '有 ' + left + ' 项没完成'}`);
    notify(`⚠️ ${k} ${DAYS[k].name} ${lv ? '请假超过 ' + CONFIG.STALE + ' 天还没补' : '有 ' + left + ' 项没完成'}，扣 ${pen} 金币`);
  }
  // 补完了：按晚了几天退还
  for (const [k, m] of Object.entries(missed)){
    if (typeof m !== 'object' || m.back || !DAYS[k] || !dayComplete(k)) continue;
    const late = daysBetween(k, T), back = Math.round(m.pen * Math.max(0, 1 - CONFIG.REFUND * late));
    m.back = back || -1; save('missed', missed);
    if (back) addCoins(back, `补完 ${DAYS[k].name}，退还`);
    notify(`📚 补完了 ${k} ${DAYS[k].name}` + (back ? `，退还 ${back} 金币` : '（太晚了，不退金币）'));
    toast(back ? `补完了，退还 ${back} 金币` : '补完了');
  }
}
// 欠着的作业：过去的工作日（含请假）还没做完
function backlog(){ const start = load('start', T); return Object.keys(DAYS || {}).filter(k => k < T && k >= start && !isWeekend(k) && !paused(k) && !okLeave(k) && !dayComplete(k)).sort(); }
function stale(){ return backlog().filter(k => daysBetween(k, T) > CONFIG.STALE); }
// 每周一推送上周周报（只推一次）
function weekly(){
  const d = new Date(T + 'T12:00'), mon = new Date(d - ((d.getDay() + 6) % 7) * 864e5), lastMon = todayStr(new Date(mon - 7 * 864e5)), lastSun = todayStr(new Date(mon - 864e5));
  const sent = load('weekly', null); if (sent === lastMon) return;
  const start = load('start', T); if (lastSun < start) { save('weekly', lastMon); return; }
  const days = Object.keys(DAYS || {}).filter(k => k >= lastMon && k <= lastSun && k >= start && !isWeekend(k) && !paused(k));
  if (!days.length) { save('weekly', lastMon); return; }  // 整周放假 / 没任务就不发
  const missed = load('missed', {}), leave = load('leave', {});
  const onTime = days.filter(k => dayComplete(k) && !missed[k] && !leave[k]).length;
  const madeUp = days.filter(k => dayComplete(k) && (missed[k] || leave[k])).length;
  const owe = days.filter(k => !dayComplete(k)).length, lv = days.filter(k => leave[k]).length;
  const net = wallet().log.filter(l => l.t.slice(0, 10) >= lastMon && l.t.slice(0, 10) <= lastSun && !l.why.startsWith('兑换')).reduce((a, l) => a + l.n, 0);
  notify(`📊 周报 ${lastMon} ~ ${lastSun}：${days.length} 个学习日，按时完成 ${onTime} 天，补完 ${madeUp} 天，还欠 ${owe} 天，请假 ${lv} 次；金币净 ${net >= 0 ? '+' : ''}${net}，余额 ${wallet().coins}`);
  save('weekly', lastMon);
}
function leaveLeft(){ const m = T.slice(0, 7); return CONFIG.LEAVE - Object.keys(load('leave', {})).filter(k => k.startsWith(m)).length; }
function askLeave(){
  modal(`<h3>今天请假？</h3><p>本月还剩 <b>${leaveLeft()}</b> 次。请假后今天没做完的任务不扣金币，也不发金币。姐姐会收到通知。</p>
    <div class="row"><button class="ghost" onclick="closeM()">算了</button><button class="main" onclick="doLeave()">确定请假</button></div>`);
}
function doLeave(){ const l = load('leave', {}); l[T] = 1; save('leave', l); notify(`🙋 ${T} 请假（本月还剩 ${leaveLeft()} 次）`); closeM(); toast('已请假'); render(); }

// ===== 今日 =====
function dayKey(){
  const ks = Object.keys(window.DAYS || {}).sort();
  if (DAYS[T] && !dayComplete(T)) return T;
  const next = ks.find(k => k > T && !dayComplete(k));
  return next || (DAYS[T] ? T : (ks.filter(k => k <= T).pop() || ks[0]));
}
function quizState(id){ return load('quiz-' + id, null); }
function taskDone(key, i, t){ if (t.lesson) return !!load('lesson', {})[t.lesson]; if (t.quiz){ const q = quizState(t.quiz); return !!(q && q.done); } return !!load('day-' + key, {})[i]; }
function dayComplete(key){ const d = DAYS[key]; return !!d && d.tasks.every((t,i) => taskDone(key, i, t)); }
function unlocked(){ return isWeekend(T) || !DAYS[T] || dayComplete(T); }

let selDay = new URLSearchParams(location.search).get('d') || null;
// 用完 ?d= 就从地址栏去掉，否则刷新时总跳回那一天（点过的日期由 sessionStorage 记住）
if (selDay) try { history.replaceState(null, '', location.pathname); } catch(e){}
function viewToday(){
  const hp = paused(T);
  if (hp && !selDay) return `<div class="c" style="text-align:center;padding:36px 16px"><div style="font-size:52px">🏖️</div><h1>假期中，好好玩！</h1><p class="s">${hp.why || ''}<br>${hp.from} ~ ${hp.to}<br>这几天不用学习、不用打卡、不扣金币</p></div>`;
  const key = selDay || dayKey(), day = DAYS[key];
  const wake = load('wake', {}), WK = ['日','一','二','三','四','五','六'];
  let h = '';
  // ① 日期条：只显示一周，左右切换
  const mon = d => { const x = new Date(d + 'T12:00'); return todayStr(new Date(x - ((x.getDay() + 6) % 7) * 864e5)); };
  const ws = wkStart || mon(key), wd = [...Array(7)].map((_, i) => todayStr(new Date(new Date(ws + 'T12:00').getTime() + i * 864e5)));
  h += `<div class="week"><button class="arr" onclick="shiftWeek(-7)">‹</button><div class="dates">` + wd.map(k => {
    const d = DAYS[k], wkd = '周' + WK[new Date(k + 'T12:00').getDay()];
    if (!d) return `<div class="date off"><small>${k === T ? '今天' : wkd}</small><b>${+k.slice(5,7)}/${+k.slice(8)}</b><small>${isWeekend(k) ? '休' : '—'}</small></div>`;
    const m = d.tasks.filter((t,i) => taskDone(k, i, t)).length;
    return `<button class="date ${k === key ? 'on' : ''} ${k === T ? 'today' : ''}" onclick="selDay='${k}';wkStart=null;render();scrollTo(0,0)"><small>${k === T ? '今天' : wkd}</small><b>${+k.slice(5,7)}/${+k.slice(8)}</b><small>${m === d.tasks.length ? '✅' : m + '/' + d.tasks.length}</small></button>`;
  }).join('') + `</div><button class="arr" onclick="shiftWeek(7)">›</button></div>`;
  // ② 起床打卡（只在今天）
  if (!isWeekend(T) && key === T){
    const wt = wake[T];
    if (wt && wt.ok === true) h += `<div class="c wake on"><b>☀️ 今天 ${wt.time} 起床打卡</b><span>+${wt.coin} 金币</span></div>`;
    else if (wt && wt.ok === 'fail') h += `<div class="c wake"><b>😴 ${wt.time} 打卡后 2 小时没开始学习，打卡作废</b></div>`;
    else if (wt) h += `<div class="c wake"><div><b>☀️ ${wt.time} 已打卡</b><div class="d">${wakeLeft(wt)} 分钟内完成第一项任务，才能拿到起床金币${wt.coin ? '（+' + wt.coin + '）' : ''}</div></div></div>`;
    else if (hm() < '06:00') h += `<div class="c wake"><div><b>🌙 现在是 ${hm()}，该睡觉啦</b><div class="d">起床打卡 06:00 开放</div></div></div>`;
    else h += `<div class="c wake"><div><b>☀️ 起床打卡</b><div class="d">14:00 前 +5 · 15:00 前 +3（2 小时内要开始学习）</div></div><button class="main sm" onclick="wakeUp()">我起床了</button></div>`;
  }
  // 新批改提醒：点一下直接跳过去
  const unseen = newFeedback();
  if (unseen.length) h += `<div class="bar-msg fbbar">📝 有 <b>${unseen.length}</b> 条新批改：${unseen.map(u => `<a class="go" href="#" onclick="openFb('${u.k}');return false">${u.name}</a>`).join(' · ')}</div>`;
  // ③ 欠账提醒
  const bl = backlog(), st = stale();
  if (bl.length) h += `<div class="bar-msg">📌 还欠 <b>${bl.length} 天</b>作业${st.length ? `（${st.length} 天超过 ${CONFIG.STALE} 天，<b>不能接单、不能兑换</b>）` : ''}：${bl.map(k => `<a class="go" href="#" onclick="selDay='${k}';render();scrollTo(0,0);return false">${+k.slice(5,7)}/${+k.slice(8)} 去补</a>`).join(' · ')}</div>`;
  if (!day) return h + '<div class="c">这一天没有任务。</div>';
  // ④ 标题 + 进度
  const late = key < T, onLeave = load('leave', {})[key] || okLeave(key), miss = load('missed', {})[key];
  const n = day.tasks.filter((t,i) => taskDone(key, i, t)).length, all = n === day.tasks.length, paid = load('paid', {})[key];
  const note = key === T ? '今天' : key > T ? '可以提前做 · 金币到这天才发' : '已经过了';
  h += `<div class="c head"><div class="row2"><div><h1>${day.name}</h1><span class="s">${key} 周${WK[new Date(key + 'T12:00').getDay()]} · ${note}</span></div><b class="big2">${n}/${day.tasks.length}</b></div><div class="prog"><i style="width:${n/day.tasks.length*100}%"></i></div></div>`;
  if (onLeave) h += `<div class="bar-msg ok">🙋 这一天请假了，不扣金币</div>`;
  else if (late && !all) h += `<div class="bar-msg">⏰ ${miss && miss.pen ? `扣了 ${miss.pen} 金币，<b>今天补完退 ${Math.round(miss.pen * Math.max(0, 1 - CONFIG.REFUND * daysBetween(key, T)))}</b>，越晚退得越少` : '补完不发金币'}</div>`;
  // ⑤ 任务卡片：按科目收成几张卡，点开看里面的小项
  const cards = day.tasks.map((t,i) => {
    const on = taskDone(key, i, t), q = t.quiz ? quizState(t.quiz) : null, wv = t.write ? load('day-' + key, {})[i] : null;
    let act = '';
    if (t.link) act += `<a class="btn2 ${t.quiz && quizState(t.quiz) ? 'light' : ''}" href="${t.link.replace('{d}', key)}">${t.lt || '📖 打开教程'}</a>`;
    // 新教程在每日手册里（id 像 d5-kjl），老教程在 lessons.html
    const lh = t.lesson && (/^d\d+-/.test(t.lesson) ? `book.html?d=${key}#${t.lesson}` : `book.html?d=2026-10-12#${t.lesson}`);
    if (t.lesson){ const lv = load('lesson', {})[t.lesson]; act += lv ? `<div class="wdone">✍️ ${lv.total ? `小测要点 ${lv.hit}/${lv.total}` : esc(lv.text)}<br><small>${lv.time} · 在教程里提交</small></div><a class="btn2 light" href="${lh}">回教程看看</a>` : `<a class="btn2" href="${lh}">📖 去上课</a>`; }
    if (t.quiz) act += q && q.first != null
      ? `<div class="d">${q.done ? '✅ 已完成' : '⏳ 还要订正'} · 第一次 ${q.first}%</div><a class="btn2 ${q.done ? 'light' : ''}" href="quiz.html?s=${t.quiz}&d=${key}">${q.done ? '查看 / 再刷' : '继续订正'}</a>`
      : `<a class="btn2" href="quiz.html?s=${t.quiz}&d=${key}">开始 →</a>`;
    if (t.write) act += wv ? `<div class="wdone">✍️ ${esc(wv.text)}<br><small>${wv.time} 提交 · <a href="#" onclick="editWrite('${key}',${i});return false">修改</a></small></div>`
      : `<textarea class="fill wbox" data-ws="w-${key}-${i}" id="w-${key}-${i}" placeholder="${t.write}" oninput="draft('${key}',${i},this.value)${t.words ? `;this.nextElementSibling.textContent=wordCount(this.value)+' / ${t.words} 词'` : ''}">${esc(load('draft', {})[key + '-' + i] || '')}</textarea>${t.words ? `<small class="wc" style="display:block;color:#888;margin-top:4px">${wordCount(load('draft', {})[key + '-' + i])} / ${t.words} 词</small>` : ''}<button class="main sm" style="margin-top:8px" onclick="submitWrite('${key}',${i})">提交</button>`;
    // 批改：data/feedback.js 里按 "日期-序号" 或教程 id 存
    const fb = (window.FEEDBACK || {})[key + '-' + i] || (t.lesson && (window.FEEDBACK || {})[t.lesson]);
    if (fb) act += `<details class="fb" ${load('fbSeen', {})[key + '-' + i] ? '' : 'open'}><summary onclick="const s=load('fbSeen',{});s['${key}-${i}']=1;save('fbSeen',s);this.querySelector('.new')?.remove()">📝 批改${load('fbSeen', {})[key + '-' + i] ? '' : ' <span class="new">新</span>'}</summary>${fb.html}</details>`;
    const tick = !t.quiz && !t.write && !t.lesson ? `onclick="tog('${key}',${i})"` : '';
    return `<div class="c task ${on ? 'done' : ''}"><div class="chk ${on?'on':''}" ${tick}>${on?'✓':''}</div>
      <div style="flex:1"><div class="t">${t.t}<span class="tcoin">🪙${taskCoin(t)}</span></div><div class="d">${t.d}</div>${act}</div></div>`;
  });
  const groups = [];
  day.tasks.forEach((t, i) => { let g = groups.find(x => x.tag === t.tag); if (!g) groups.push(g = {tag: t.tag, idx: []}); g.idx.push(i); });
  const ICON = {英语: '🔤', 数学: '📐', 语文: '📖', 物理: '⚡', 化学: '🧪', 历史: '🏛️', 道法: '⚖️', 项目: '🛠️', 复习: '🔁'}, openG = JSON.parse(sessionStorage.getItem('openG') || '{}');
  h += groups.map(g => {
    const n = g.idx.filter(i => taskDone(key, i, day.tasks[i])).length, all2 = n === g.idx.length, gid = key + g.tag;
    const dots = g.idx.map(i => taskDone(key, i, day.tasks[i]) ? '✅' : '⬜️').join('');
    const coins = g.idx.reduce((a, i) => a + taskCoin(day.tasks[i]), 0);
    return `<details class="c grp ${all2 ? 'gdone' : ''}" ${openG[gid] ? 'open' : ''} ontoggle="const o=JSON.parse(sessionStorage.getItem('openG')||'{}');o['${gid}']=this.open;sessionStorage.setItem('openG',JSON.stringify(o))">
      <summary><span class="gicon">${ICON[g.tag] || '📌'}</span><span class="gname"><b>${g.tag}</b><small>${g.idx.length} 小项 · 🪙${coins}</small></span><span class="gdots">${dots}</span><b class="gnum">${n}/${g.idx.length}</b></summary>
      ${g.idx.map(i => cards[i]).join('')}</details>`;
  }).join('');
  // ⑥ 完成 / 领奖
  if (all) h += `<div class="c done-card"><b>🎉 ${late ? '补完了！' : key > T ? '提前做完了！' : '今天全部完成！'}</b>${paid ? '<div class="d">已领取 +' + CONFIG.DAILY_COIN + ' 金币，去接单吧</div>' : late ? (miss && miss.back > 0 ? '<div class="d">已退还 ' + miss.back + ' 金币</div>' : '<div class="d">补完了</div>') : key > T ? '<div class="d">金币（每项的金币和全勤 +' + CONFIG.DAILY_COIN + '）到那一天打开网站时发</div>' : `<button class="main" onclick="claimDay('${key}')">领取全勤奖励 +${CONFIG.DAILY_COIN} 金币</button>`}</div>`;
  // ⑦ 汇报（截图用）+ 请假，放最下面
  const wk2 = wake[key], got = wallet().log.filter(l => l.t.startsWith(key) && l.n > 0).reduce((a,l) => a + l.n, 0);
  h += `<details class="c report"><summary>📋 今日汇报（需要时截图）</summary>
    <div>起床：${wk2 ? wk2.time : '未打卡'}</div>
    ${day.tasks.map((t,i) => { const q = t.quiz ? quizState(t.quiz) : null; return `<div>${taskDone(key,i,t) ? '✅' : '⬜️'} ${t.t}${q && q.first != null ? ` · 第一次 ${q.first}%` : ''}</div>`; }).join('')}
    <div>获得：🪙 ${got}</div></details>`;
  if (!onLeave && key === T && !isWeekend(T) && !all && leaveLeft() > 0) h += `<button class="ghost" onclick="askLeave()">今天请假（本月还剩 ${leaveLeft()} 次）</button>`;
  return h;
}
// 新批改：feedback.js 里还没看过的（任务"日期-序号"、教程 id、订单 id）
function newFeedback(){
  const F = window.FEEDBACK || {}, seen = load('fbSeen', {}), out = [];
  for (const k of Object.keys(F)){
    if (seen[k]) continue;
    let m = k.match(/^(\d{4}-\d\d-\d\d)-(\d+)$/), name = '';
    if (m && DAYS[m[1]] && DAYS[m[1]].tasks[+m[2]]) name = DAYS[m[1]].tasks[+m[2]].t;
    else if (job(k)) name = job(k).title;
    else { for (const d of Object.keys(DAYS)) DAYS[d].tasks.forEach((t, i) => { if (t.lesson === k){ name = t.t; if (seen[d + '-' + i]) seen[k] = 1; } }); }
    if (name && !seen[k]) out.push({k, name});
  }
  return out;
}
function openFb(k){
  const s = load('fbSeen', {}); s[k] = 1; save('fbSeen', s);
  if (job(k)){ tab = 'jobs'; jobSel = k; render(); scrollTo(0, 0); return; }

  const jobsDone = (window.JOBS || []).filter(j => jget(j.id).st === 'done').length;
  const days = Object.keys(load('paid', {})).length;
  let h = `<h1>我的</h1><div class="c profile"><div class="avatar">${L.icon}</div><div style="flex:1"><b class="lvname">Lv${L.lv} · ${L.name}</b>
    <div class="prog"><i style="width:${pct}%"></i></div><div class="d">${N ? `累计 ${w.earned} / ${N.need} 升到「${N.name}」` : '最高等级！'}</div></div></div>
    <div class="c"><b>🏅 等级表</b><div class="d">按累计赚到的金币升级（兑换零花钱不会掉级）</div>${LEVELS.map(l => `<div class="log"><span>${l.icon} Lv${l.lv} ${l.name}</span><span>${l.need ? '累计 ' + l.need + ' 金币' : '起点'} ${w.earned >= l.need ? '✅' : ''}</span></div>`).join('')}</div>
    <div class="c stats"><div><b>${w.coins}</b><small>金币余额</small></div><div><b>${jobsDone}</b><small>完成订单</small></div><div><b>${days}</b><small>完成天数</small></div></div>
    <div class="c"><b>💰 兑换零花钱</b><div class="d">${CONFIG.RATE} 金币 = 1 元 · 现在可换 <b>${Math.floor(w.coins / CONFIG.RATE)}</b> 元</div>
    ${stale().length ? `<div class="bar-msg">📌 有作业欠了超过 ${CONFIG.STALE} 天，补完才能兑换</div>` : ''}
    <button class="gold" ${w.coins < CONFIG.RATE || stale().length ? 'disabled' : ''} onclick="cashOut()">申请兑换</button></div>
    <div class="c"><b>📜 金币记录</b>`;
  h += w.log.length ? w.log.slice(0, 30).map(l => `<div class="log"><span>${l.why}<br><small>${l.t}</small></span><b class="${l.n > 0 ? 'plus' : ''}">${l.n > 0 ? '+' : ''}${l.n}</b></div>`).join('') : '<div class="d">还没有记录</div>';
  return h + '</div>';
}
function cashOut(){
  const y = Math.floor(wallet().coins / CONFIG.RATE);
  modal(`<h3>兑换 ${y} 元</h3><p>确认后扣掉 ${y * CONFIG.RATE} 金币，截图发给姐姐，姐姐转钱给你。</p>
    <div class="row"><button class="ghost" onclick="closeM()">先攒着</button><button class="gold" onclick="doCash(${y})">确认兑换</button></div>`);
}
function doCash(y){ addCoins(-y * CONFIG.RATE, `兑换 ${y} 元零花钱`); notify(`💰 申请兑换 ${y} 元零花钱`); closeM(); toast('已申请，截图发给姐姐'); render(); }

// ===== 通用 =====
function modal(h){ $('#mbox').innerHTML = h; $('#modal').classList.add('show'); }
function closeM(){ $('#modal').classList.remove('show'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeM(); };
// 刷新后停在原来的页面（标签、订单详情、日期）
try { const nav = JSON.parse(sessionStorage.getItem('nav') || '{}'); if (nav.tab) tab = nav.tab; if (nav.job) jobSel = nav.job; if (nav.day && !selDay) selDay = nav.day; } catch(e){}
function render(){
  try { sessionStorage.setItem('nav', JSON.stringify({tab, job: jobSel, day: selDay})); } catch(e){}
  if (window.DAYS){ applyAdjust(); settle(); checkMissed(); weekly(); checkJobs(); }
  const w = wallet(); $('#coin').textContent = w.coins; const L = level(w.earned); $('#lv').textContent = `Lv${L.lv} · ${L.name}`;
  $('#view').innerHTML = (PREVIEW ? '<div class="bar-msg ok">👀 预览模式：你看到的是全部内容（不锁），诗予那边该锁的照样锁。这里的操作只改你自己浏览器的数据，不推送。</div>' : '') + {today: viewToday, jobs: viewJobs, book: viewBook, me: viewMe}[tab]();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  document.querySelectorAll('textarea[data-ws]').forEach(el => guardWrite(el, el.dataset.ws));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; jobSel = null;  render(); scrollTo(0, 0); });
</script></body></html>
