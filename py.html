<script>
const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LID = new URLSearchParams(location.search).get('l') || 'py1';
let ready = false, T0 = Date.now();
// Python 引擎：Skulpt（纯 JavaScript，约 1MB，iPad 旧版 Safari 也能跑）。本站文件加载失败就换国内镜像
const SKSRC = [['vendor/skulpt/skulpt.min.js', 'vendor/skulpt/skulpt-stdlib.js'], ['https://registry.npmmirror.com/skulpt/1.2.0/files/dist/skulpt.min.js', 'https://registry.npmmirror.com/skulpt/1.2.0/files/dist/skulpt-stdlib.js']];
function loadJS(src){ return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
(async () => {
  for (const [a, b] of SKSRC){
    try { await loadJS(a); await loadJS(b); if (window.Sk){ ready = true; const l = document.getElementById('load'); if (l){ l.textContent = '✅ Python 准备好了'; setTimeout(() => l.remove(), 1500); } return; } } catch (e){}
  }
  const l = document.getElementById('load'); if (l) l.innerHTML = '❌ Python 加载不出来。换个网络（比如 Wi-Fi 换成流量）再刷新试试，或者截图告诉姐姐。';
})();
// 运行一次：pre（测试前准备）+ 她的代码 + after（检查用的 assert）拼在一起跑；超过 5 秒当死循环
async function run(code, stdin, after, pre){
  let out = ''; const q = [...(stdin || [])];
  const preN = pre ? pre.split('\n').length : 0, codeN = code.split('\n').length;
  const prog = (pre ? pre + '\n' : '') + code + (after ? '\n' + after : '');
  Sk.configure({__future__: Sk.python3, output: t => { out += t; },
    read: x => { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles.files[x]; },
    inputfun: p => { if (!q.length){ out += '\x01' + p + '\n'; throw new Sk.builtin.EOFError('程序要输入，但输入框里已经没有内容了'); } const v = q.shift(); out += '\x01' + p + v + '\n'; return v; },
    inputfunTakesPrompt: true, execLimit: 5000, yieldLimit: 100});
  try { await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, prog, true)); return {out, ok: true}; }
  catch (e){
    let msg = String(e && e.toString ? e.toString() : e);
    if (/TimeLimitError/.test(msg)) return {out, ok: false, err: 'TIMEOUT'};
    const m = msg.match(/on line (\d+)/); let ln = m ? +m[1] - preN : 0;
    if (after && ln > codeN) return {out, ok: false, err: 'CHECK:' + msg.replace(/^AssertionError:\s*/, '').replace(/ on line \d+/, '')};
    if (m) msg = msg.replace(/ on line \d+/, '') + (ln > 0 ? `\n@line ${ln}` : '');
    return {out, ok: false, err: msg};
  }
}
// iPad 中文键盘会打出中文标点和弯引号：引号统一换成直的，字符串外面的中文标点换成英文的
function clean(src){
  src = src.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/ /g, ' ');
  const map = {'（':'(', '）':')', '：':':', '，':',', '＝':'=', '［':'[', '］':']', '【':'[', '】':']', '＋':'+', '－':'-', '＊':'*', '／':'/', '＜':'<', '＞':'>', '；':';', '＃':'#', '　':' '};
  let r = '', q = null, cm = false;
  for (let i = 0; i < src.length; i++){
    const c = src[i];
    if (c === '\n'){ cm = false; r += c; continue; }
    if (cm){ r += c; continue; }
    if (q){ r += c; if (c === '\\'){ r += src[++i] || ''; continue; } if (c === q) q = null; continue; }
    if (c === '"' || c === "'"){ q = c; r += c; continue; }
    if (c === '#'){ cm = true; r += c; continue; }
    r += map[c] || c;
  }
  return r;
}
// 把常见报错翻译成大白话
function explain(err){
  if (err === 'TIMEOUT') return '程序跑了 5 秒还没停，可能是<b>死循环</b>（while 的条件一直成立）。';
  if (err.startsWith('CHECK:')) return '检查没通过：' + esc(err.slice(6).trim().split('\n').pop());
  const lm = err.match(/@line (\d+)/), ln = lm ? lm[1] : '';
  const last = err.replace(/\n@line \d+/, '').trim();
  const H = [
    [/EOFError/, '程序要用 input() 读输入，但输入框里的内容不够。在「程序的输入」框里多写几行。'],
    [/IndentationError|unexpected indent|expected an indented block/, '<b>缩进</b>不对：if、for、def 后面那一行要往里空 4 格；不该空格的地方别空。'],
    [/SyntaxError.*(EOL|unterminated string)/, '<b>引号没配对</b>：文字要用一对英文引号包起来，比如 "你好"。'],
    [/SyntaxError.*'\(' was never closed|never closed/, '<b>括号没配对</b>：数一数 ( 和 ) 是不是一样多。'],
    [/SyntaxError.*expected ':'/, '这一行末尾少了<b>冒号 :</b>（if、for、while、def 后面都要有）。'],
    [/SyntaxError/, '<b>语法错误</b>：检查这一行（和上一行）：冒号 : 有没有漏？缩进对不对？括号、引号是不是成对？'],
    [/NameError: name '(.+?)'/, m => `不认识 <b>${esc(m[1])}</b>：是不是拼错了？或者忘了先给它赋值？如果它是文字，要加引号。`],
    [/cannot concatenate 'str' and|unsupported operand type\(s\) for [+-].*'(str|int)'.*'(str|int)'/, '<b>文字和数字不能直接相加</b>：如果这个值是 input() 拿到的，要先用 int() 变成数字；如果是想把数字拼进句子，用 f"…{变量}…"。'],
    [/TypeError: can only concatenate str/, '<b>文字和数字不能直接相加</b>：如果这个值是 input() 拿到的，要先用 int() 变成数字；如果是想把数字拼进句子，用 f"…{变量}…"。'],
    [/TypeError: unsupported operand type.*'str' and 'int'|'int' and 'str'/, '<b>文字不能和数字做加减</b>：input() 得到的是文字，要先用 int() 变成数字。'],
    [/ValueError: invalid literal for int/, 'int() 只能把<b>像数字的文字</b>变成数字，比如 int("15")；int("十五") 就不行。检查输入框。'],
    [/ZeroDivisionError/, '<b>除以 0</b> 了。'],
    [/IndexError/, '<b>下标超出范围</b>：列表有 n 个东西，下标只能是 0 到 n−1。'],
  ];
  for (const [re, h] of H){ const m = last.match(re) || err.match(re); if (m) return (ln ? `第 ${ln} 行：` : '') + (typeof h === 'function' ? h(m) : h) + `<br><small style="opacity:.7">${esc(last)}</small>`; }
  return (ln ? `第 ${ln} 行：` : '') + esc(last);
}
const norm = s => String(s).replace(/[ \t]+$/gm, '').trim();
const noEcho = s => String(s).split('\n').filter(l => !l.startsWith('\x01')).join('\n'), unmark = s => String(s).replace(/\x01/g, '');
// 测试：in 输入；has 输出里要出现的内容；eq 输出完全一致；py 运行完以后再执行的检查代码（assert）
async function check(ex, code){
  for (const [k, t] of ex.tests.entries()){
    for (const [re, msg] of t.src || []) if (!re.test(code)) return {ok: false, msg, t};
    if (!t.in) continue;  // 只查代码的测试
    const r = await run(code, t.in || [], t.py, t.pre);
    if (!r.ok) return {ok: false, msg: explain(r.err), out: r.out, t};
    const o = norm(unmark(r.out)), oq = norm(noEcho(r.out));
    if (t.eq != null && oq !== norm(t.eq)) return {ok: false, msg: `输出和要求的不一样。`, out: r.out, t, want: t.eq};
    const loose = x => String(x).replace(/\s+/g, '').replace(/，/g, ',').replace(/！/g, '!').replace(/：/g, ':').replace(/？/g, '?');
    for (const h of t.has || []) if (!loose(o).includes(loose(h))) return {ok: false, msg: `输出里应该有「<b>${esc(h)}</b>」，但没找到。`, out: r.out, t};
    for (const h of t.not || []) if (o.includes(h)) return {ok: false, msg: `输出里不应该有「<b>${esc(h)}</b>」。`, out: r.out, t};
    if (t.any && !t.any.some(h => loose(o).includes(loose(h)))) return {ok: false, msg: `输出里应该有「<b>${t.any.map(esc).join('</b>」或「<b>')}</b>」其中一个。`, out: r.out, t};
    if (t.order){ const lo = noEcho(r.out), ix = t.order.map(x => lo.lastIndexOf(x)); if (ix.some((v, n) => v < 0 || (n && v < ix[n - 1]))) return {ok: false, msg: `排名顺序不对：应该是 ${t.order.map(esc).join(' → ')}。`, out: r.out, t}; }
  }
  return {ok: true};
}
const ST = () => load('py', {}), saveST = s => save('py', s);
function editor(id, code, opts = {}){
  return `<div class="ed" id="ed-${id}">
  <textarea class="code" id="c-${id}" data-ws="${id === 'free' ? 'pyfree-' + FS().cur : 'py-' + LID + '-' + id}" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" rows="${Math.max(4, code.split('\n').length + 1)}">${esc(code)}</textarea>
  <div class="keys">${['⇥', ':', '(', ')', '"', '=', '+', '[', ']', '{', '}', '#', '_'].map(k => `<button type="button" onclick="key('${id}','${k}')">${k === '"' ? '&quot;' : k}</button>`).join('')}</div>
  ${opts.stdin != null ? `<textarea class="stdin" id="i-${id}" placeholder="程序的输入：每行一个（程序里每个 input() 读一行）" autocapitalize="off" autocorrect="off">${esc(opts.stdin)}</textarea>` : ''}
  <div class="pbar"><button class="run" onclick="tryRun('${id}')">▶ 运行</button>${opts.check ? `<button class="pchk" onclick="submitEx('${id}')">✓ 提交检查</button>` : ''}${opts.free ? `<button class="rst" onclick="freeCopy()">📋 复制代码</button>` : `<button class="rst" onclick="resetEd('${id}')">重置</button>`}</div>
  <div class="out" id="o-${id}" hidden></div><div id="r-${id}"></div></div>`;
}
function key(id, k){
  const ta = document.getElementById('c-' + id), s = ta.selectionStart, e = ta.selectionEnd, ins = k === '⇥' ? '    ' : k === '(' ? '()' : k === '"' ? '""' : k === '[' ? '[]' : k === '{' ? '{}' : k;
  ta.setRangeText(ins, s, e, 'end'); if (['()', '""', '[]', '{}'].includes(ins)) ta.selectionStart = ta.selectionEnd = s + 1; ta.focus(); draftSave(id);
}
function draftSave(id){ if (id === 'free') return freeSave();
  const s = ST(); s.draft = s.draft || {}; s.draft[LID + '/' + id] = document.getElementById('c-' + id).value; saveST(s); }
document.addEventListener('keydown', e => {
  const ta = e.target; if (!ta.classList || !ta.classList.contains('code')) return;
  if (e.key === 'Tab'){ e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); }
  if (e.key === 'Enter'){ // 自动缩进：保持上一行的缩进，行末是冒号就多缩 4 格
    const v = ta.value.slice(0, ta.selectionStart), line = v.split('\n').pop(), ind = line.match(/^ */)[0] + (/:\s*$/.test(line) ? '    ' : '');
    e.preventDefault(); ta.setRangeText('\n' + ind, ta.selectionStart, ta.selectionEnd, 'end');
  }
});
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('code')) draftSave(e.target.id.slice(2)); else if (e.target.id === 'i-free') freeSave(); });
const findEx = id => (P.ex || []).find(x => x.id === id), findDemo = id => DEMOS[id];
let P, DEMOS = {};
// 防作弊：代码框不能粘贴（姐姐的预览浏览器可以），记录写了多久、打字和删改次数、切出页面几次
function guardCodes(){ if (!PREVIEW) document.querySelectorAll('textarea.code[data-ws]').forEach(el => guardWrite(el, el.dataset.ws)); }
// 自由编辑器运行结果最后一行：写代码统计（截图里能看到）
function codeStats(){
  if (PREVIEW) return '';
  const st = _wsGet('pyfree-' + FS().cur), min = Math.round(st.ms / 60000);
  return `\n—— ⏱ 这个程序写了约 ${min} 分钟 · 打字 ${st.keys} 次 · 删改 ${st.del} 次 · 切出页面 ${st.away} 次 · 想粘贴 ${st.paste} 次`;
}
async function tryRun(id){
  if (!ready) return toast('Python 还在加载，稍等一下');
  const code = clean(document.getElementById('c-' + id).value), si = document.getElementById('i-' + id);
  const o = document.getElementById('o-' + id); o.hidden = false; o.textContent = '运行中……';
  const r = await run(code, si && si.value.trim() ? si.value.replace(/\n+$/, '').split('\n') : []);
  o.innerHTML = esc(unmark(r.out)) + (r.ok ? '' : `<span class="e">${r.out ? '\n' : ''}❌ 出错了</span>\n<span class="h">${explain(r.err)}</span>`);
  if (!r.out && r.ok) o.innerHTML = '<span class="h">（程序运行完了，但没有输出任何东西。要用 print() 才会显示。）</span>';
  if (id === 'free') o.innerHTML += `<span class="h">${esc(codeStats())}</span>`;
}
async function submitEx(id){
  if (!ready) return toast('Python 还在加载，稍等一下');
  const ex = findEx(id), code = clean(document.getElementById('c-' + id).value), box = document.getElementById('r-' + id);
  box.innerHTML = '<div class="pres">检查中……</div>';
  const s = ST(); s[LID] = s[LID] || {}; const rec = s[LID][id] = s[LID][id] || {tries: 0}; rec.tries++;
  const r = await check(ex, code);
  if (r.ok){ rec.ok = true; rec.code = code; saveST(s); box.innerHTML = `<div class="pres ok">✅ 通过！${ex.project ? '你的作品完成了 🎉' : '点「下一题 →」继续'}</div>`; const nb = document.getElementById('next-' + id); if (nb) nb.className = 'main'; paint(); finish(); return; }
  saveST(s);
  const t = r.t || {};
  box.innerHTML = `<div class="pres no">❌ 还没通过（第 ${rec.tries} 次）。${r.msg}${t.in && t.in.length ? `<br>测试用的输入：<code>${t.in.map(esc).join(' / ')}</code>` : ''}${r.want ? `<br>要求输出：<pre style="margin:4px 0">${esc(r.want)}</pre>` : ''}${r.out ? `<br>你的程序输出：<pre style="margin:4px 0">${esc(unmark(r.out))}</pre>` : ''}</div>${rec.tries >= 3 && ex.hint ? `<div class="tip">💡 提示：${ex.hint}</div>` : ''}`;
}
function resetEd(id){ const ex = findEx(id), d = findDemo(id), s = ST(); if (s.draft) delete s.draft[LID + '/' + id]; saveST(s); document.getElementById('c-' + id).value = ex ? ex.starter : d; }
let CUR = null;
function paint(){
  const s = (ST()[LID]) || {};
  document.getElementById('pyprog').innerHTML = P.ex.map((x, i) => `<span style="cursor:pointer" onclick="showEx('${x.id}')" class="${s[x.id] && s[x.id].ok ? 'ok' : ''}${x.id === CUR ? ' cur' : ''}">${s[x.id] && s[x.id].ok ? '✅' : '⬜️'} ${x.project ? '🎮 作品' : '练习 ' + (i + 1)}</span>`).join('');
}
// 练习区一次只显示一题
function showEx(id, scroll = true){
  const s = ST(), dr = s.draft || {}, i = P.ex.findIndex(x => x.id === id), x = P.ex[i], ok = ((s[LID] || {})[id] || {}).ok;
  CUR = id;
  document.getElementById('exbox').innerHTML = `<div class="pyex" id="${x.id}"><h3 style="margin:10px 0 4px"><span class="n">${x.project ? '🎮 作品' : '练习 ' + (i + 1) + ' / ' + P.ex.filter(e => !e.project).length}</span> ${x.title}${ok ? ' ✅' : ''}</h3><div>${x.desc}</div>
    ${editor(x.id, dr[LID + '/' + x.id] ?? x.starter, {stdin: x.stdin ?? null, check: true})}
    ${x.hint ? `<details class="hint"><summary>卡住了？看提示</summary><div class="tip">${x.hint}</div></details>` : ''}
    <div class="exnav">${i > 0 ? `<button class="ghost" onclick="showEx('${P.ex[i - 1].id}')">← 上一题</button>` : '<span></span>'}${i < P.ex.length - 1 ? `<button class="${ok ? 'main' : 'ghost'}" id="next-${x.id}" onclick="showEx('${P.ex[i + 1].id}')">下一题 →</button>` : ''}</div></div>`;
  paint(); guardCodes();
  if (scroll){ const el = document.getElementById('practice'); window.scrollTo({top: el.getBoundingClientRect().top + window.pageYOffset - 10, behavior: 'smooth'}); }
}
// 全部通过：记进 lesson（首页任务自动打勾），推送给姐姐
function finish(){
  const s = ST()[LID] || {}, all = P.ex.every(x => s[x.id] && s[x.id].ok), L = load('lesson', {});
  if (!all || L[LID]) return;
  const tries = P.ex.reduce((a, x) => a + s[x.id].tries, 0), proj = P.ex.find(x => x.project);
  L[LID] = {text: `全部 ${P.ex.length} 题通过，一共提交 ${tries} 次`, time: todayStr() + ' ' + hm(), hit: P.ex.length, total: P.ex.length}; save('lesson', L);
  notify(`🐍 ${P.title}：${P.ex.length} 题全部通过（一共提交 ${tries} 次，约 ${Math.max(1, Math.round((Date.now() - T0) / 60000))} 分钟）` + (proj ? `\n🎮 她的作品代码：\n${s[proj.id].code}` : ''));
  toast('🎉 这一课全部完成！');
}
function render(){
  document.title = P.title; document.getElementById('title').textContent = '🐍 ' + P.title;
  const s = ST(), dr = s.draft || {};
  let h = `<p class="lede">${P.intro}</p><div class="tip">📖 <b>怎么学：</b>先从上往下看 01–04 四小节讲解（黑色代码框能点 ▶ 运行，每节后面有「✏️ 改一改」，自己动手改了再运行）。看完到最下面的<b>「✍️ 练习区」</b>，一次做一题。 <a href="#" onclick="event.preventDefault();showEx(CUR)">直接去练习区 ↓</a></div>`;
  let n = 0;
  for (const sec of P.secs){
    const html = sec.html.replace(/<demo>([\s\S]*?)<\/demo>/g, (_, c) => { const id = 'd' + (++n); DEMOS[id] = c.replace(/^\n/, ''); return editor(id, dr[LID + '/' + id] ?? DEMOS[id], {stdin: /input\(/.test(c) ? '' : null}); });
    h += `<div class="sec" id="${sec.id}"><h3><span class="n">${sec.n}</span>${sec.title}</h3>${html}</div>`;
  }
  h += `<div class="sec" id="practice"><h3><span class="n">✍️</span>练习区</h3><div class="pyprog" id="pyprog"></div><div id="exbox"></div></div>`;
  document.getElementById('main').innerHTML = h;
  guardCodes();
  const done = (ST()[LID]) || {}; showEx((P.ex.find(x => !(done[x.id] && done[x.id].ok)) || P.ex[0]).id, false);
}
// ===== 自由编辑器（py.html?l=free）：自己随便写，不判题。可以存好几个程序，都存在本机的 pyfree 里 =====
// 从编程订单点进来是 ?l=free&p=J27&from=py1：自动打开（没有就新建）以订单命名的程序，里面先放好第 N 课作品的代码
const FS = () => load('pyfree', {progs: {}, cur: null}), saveFS = s => save('pyfree', s);
let FJOB = null;
async function freeInit(){
  const q = new URLSearchParams(location.search), pj = q.get('p'), from = q.get('from'), s = FS();
  document.title = '自由编辑器'; document.getElementById('title').textContent = '🐍 自由编辑器';
  if (pj){
    await loadJS('data/jobs.js?v=' + Date.now()).catch(() => {});
    await loadJS('data/py/selftest.js?v=' + Date.now()).catch(() => {});
    FJOB = (window.JOBS || []).find(x => x.id === pj) || null;
    if (FJOB) document.querySelector('.back').textContent = '← 回到订单';
    if (!s.progs[pj]){
      let code = '';
      if (from){
        await loadJS(`data/py/${from}.js?v=${Date.now()}`).catch(() => {});
        const proj = window.PY && (window.PY.ex || []).find(x => x.project), mine = proj && ((ST()[from] || {})[proj.id] || {}).code;
        if (proj) code = `# 下面是你第 ${from.slice(2)} 课作品的代码，在这上面升级\n` + (mine || proj.starter);
      }
      code = (FJOB ? `# ${FJOB.title}\n` : '') + code;
      s.progs[pj] = {name: FJOB ? `${jobNo(FJOB)} ${FJOB.title}` : pj, code, base: code.length, stdin: '', t: Date.now()};
    }
    s.cur = pj;
  }
  if (!s.progs[s.cur]){ const k = Object.keys(s.progs)[0]; s.cur = k || freeAdd(s, '我的程序 1'); }
  saveFS(s); freeRender();
}
function freeAdd(s, name){ const k = 'p' + Date.now(); s.progs[k] = {name, code: '', stdin: '', t: Date.now()}; return k; }
function freeRender(){
  const s = FS(), p = s.progs[s.cur], ks = Object.keys(s.progs).sort((a, b) => s.progs[b].t - s.progs[a].t);
  const li = a => '<ul>' + (a || []).map(x => `<li>${x}</li>`).join('') + '</ul>';
  document.getElementById('main').innerHTML = `<p class="lede">想写什么就写什么，不判对错。代码自动存在这台 iPad 上，可以存好几个程序，用下面的菜单切换。</p>
    ${FJOB ? `<details class="hint ${PREVIEW ? '' : 'nocopy'}" open><summary>📋 订单要求：${esc(jobNo(FJOB) + ' ' + FJOB.title)}</summary><div class="tip">${FJOB.brief}${li(FJOB.spec)}<b>验收：</b>${li(FJOB.accept)}</div></details>` : ''}
    <div class="frow"><select onchange="freeSwitch(this.value)">${ks.map(k => `<option value="${k}" ${k === s.cur ? 'selected' : ''}>${esc(s.progs[k].name)}</option>`).join('')}</select>
    <button class="ghost" onclick="freeNew()">＋ 新程序</button><button class="ghost" onclick="freeRename()">改名</button><button class="ghost" onclick="freeDel()">删除</button></div>
    ${editor('free', p.code, {stdin: p.stdin || '', free: true})}
    ${(window.SELFTEST || {})[s.cur] ? `<div class="sec" style="margin-top:12px"><h3><span class="n">🧪</span>自检${p.passed ? ' ✅' : ''}</h3><p class="s" style="margin:4px 0">写完先点自检，<b>全部通过才能提交这单</b>。自检会依次输入：${esc(SELFTEST[s.cur].inputs)}。</p><button class="main" onclick="selfCheck()">🧪 自检</button><div id="self-r"></div></div>` : ''}
    <div class="tip">💡 程序里有 input() 的话，先把要输入的内容写在「程序的输入」框里，每行一个，再点运行。交订单：截图代码和运行结果发工作室群，也可以点「📋 复制代码」贴过去。</div>`;
  guardCodes();
}
// 自检：跑这单的测试。第一次通过（或代码改过后再通过）推送给姐姐：统计 + 建议给哪个码 + 代码
function codeFlags(p){
  const st = _wsGet('pyfree-' + FS().cur), f = [];
  if (st.paste) f.push(`想粘贴 ${st.paste} 次（被拦下）`);
  if (st.chunk) f.push(`一次冒出一大段 ${st.chunk} 次`);
  if (st.away >= 3) f.push(`写代码时切出页面 ${st.away} 次`);
  if (p.code.length - (p.base || 0) > 3 * st.keys + 60) f.push('代码比她打的字多很多');
  return {st, f, min: Math.round(st.ms / 60000)};
}
async function selfCheck(){
  if (!ready) return toast('Python 还在加载，稍等一下');
  freeSave(); const s = FS(), id = s.cur, p = s.progs[id], T_ = SELFTEST[id], code = clean(p.code), box = document.getElementById('self-r');
  box.innerHTML = '<div class="pres">自检中……</div>';
  p.tries = (p.tries || 0) + 1; saveFS(s);
  const r = await check(T_, code);
  if (!r.ok){
    const t = r.t || {};
    box.innerHTML = `<div class="pres no">❌ 还没通过（第 ${p.tries} 次自检）。${r.msg}${t.in && t.in.length ? `<br>自检用的输入：<code>${t.in.map(esc).join(' / ')}</code>` : ''}${r.out ? `<br>你的程序输出：<pre style="margin:4px 0;white-space:pre-wrap">${esc(unmark(r.out))}</pre>` : ''}</div>`;
    return;
  }
  const sig = fnv(code), fresh = p.passed !== sig; p.passed = sig; saveFS(s);
  box.innerHTML = `<div class="pres ok">✅ 自检全部通过！回订单页点「我做完了，提交」，再把代码和运行结果截图发工作室群。</div>`;
  if (!fresh) return;
  const {st, f, min} = codeFlags(p), j = FJOB || {title: p.name};
  const rec = T_.rough ? '👉 这单自检只能粗查（冒险游戏的路线每个人不一样）：看截图，能走到新房间 / 新结局、描述有画面感 → 满意码；勉强做到 → 一般码。'
    : f.length ? `👉 建议：一般码。测试全过，但有异常：${f.join('；')}。可以先让她讲讲代码怎么写的，讲得清楚再给满意码。`
    : '👉 建议：满意码（测试全过，没发现异常）。截图对得上就给。';
  notify(`🧪 自检通过：${FJOB ? jobNo(FJOB) + ' ' : ''}${j.title}（${T_.tests.length} 项全过，第 ${p.tries} 次自检）\n⏱ 写了约 ${min} 分钟 · 打字 ${st.keys} 次 · 删改 ${st.del} 次 · 切出页面 ${st.away} 次\n${rec}\n—— 代码 ——\n${code}`);
  const html = box.innerHTML; freeRender(); document.getElementById('self-r').innerHTML = html;
}
function freeSave(){
  const s = FS(), p = s.progs[s.cur], c = document.getElementById('c-free'), i = document.getElementById('i-free'); if (!p) return;
  if (c) p.code = c.value; if (i) p.stdin = i.value; p.t = Date.now(); saveFS(s);
}
function freeSwitch(k){ freeSave(); const s = FS(); s.cur = k; saveFS(s); freeRender(); }
function freeNew(){
  freeSave(); const s = FS(), name = prompt('新程序叫什么名字？', '我的程序 ' + (Object.keys(s.progs).length + 1));
  if (name == null) return; s.cur = freeAdd(s, name.trim() || '没起名的程序'); saveFS(s); freeRender();
}
function freeRename(){
  const s = FS(), p = s.progs[s.cur], name = prompt('改成什么名字？', p.name);
  if (!name || !name.trim()) return; freeSave(); const s2 = FS(); s2.progs[s2.cur].name = name.trim(); saveFS(s2); freeRender();
}
function freeDel(){
  const s = FS(), p = s.progs[s.cur]; if (!confirm(`删除「${p.name}」？删了就找不回来了。`)) return;
  clearWrite('pyfree-' + s.cur); delete s.progs[s.cur]; s.cur = Object.keys(s.progs)[0] || freeAdd(s, '我的程序 1'); saveFS(s); freeRender(); toast('已删除');
}
function freeCopy(){
  const c = document.getElementById('c-free');
  const fallback = () => { c.focus(); c.select(); try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制不了，长按代码手动复制'); } };
  if (navigator.clipboard) navigator.clipboard.writeText(c.value).then(() => toast('已复制，去工作室群粘贴'), fallback); else fallback();
}
if (LID === 'free') freeInit();
else {
  const sc = document.createElement('script'); sc.src = `data/py/${LID}.js?v=${Date.now()}`;
  sc.onload = () => { P = window.PY; render(); }; sc.onerror = () => { document.getElementById('main').innerHTML = '<p>找不到这一课。</p>'; };
  document.body.appendChild(sc);
}
</script>
