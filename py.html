<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Python 练习台</title>
<script src="common.js?v=1792737713"></script>
<link rel="stylesheet" href="style.css?v=1792737713">
<style>
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.sec h3{margin:0 0 6px;font-size:17px;display:flex;gap:8px;align-items:baseline}.sec h3 .n{color:var(--acc);font-size:14px;font-weight:800}
.sec p{margin:8px 0}.sec ul,.sec ol{padding-left:20px}
.lede{color:var(--soft);font-size:14.5px}
.why{background:var(--blue-soft);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:10px 0}
.tip{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:10px 0}
.warn{background:var(--bad-soft);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left}table.t th{background:var(--bg)}
code{background:var(--bg);border-radius:5px;padding:1px 5px;font-size:14px}
.ed{margin:10px 0}
.ed textarea.code{width:100%;box-sizing:border-box;min-height:90px;font:14.5px/1.5 Menlo,Consolas,monospace;background:#2b2622;color:#f6f1ea;border:0;border-radius:10px 10px 0 0;padding:10px 12px;resize:vertical;tab-size:4}
.keys{display:flex;gap:4px;overflow-x:auto;background:#3a332d;padding:5px}
.keys button{flex:0 0 auto;width:auto;min-width:36px;padding:5px 9px;font:14px Menlo,monospace;background:#57504a;color:#fff;border:0;border-radius:6px}
.ed .pbar{display:flex;gap:6px;align-items:center;background:#3a332d;border-radius:0 0 10px 10px;padding:6px}
.ed .pbar button{width:auto;padding:7px 14px;font-size:14px;border-radius:8px}
.ed .pbar .run{background:#6aa86a;color:#fff;border:0}.ed .pbar .pchk{background:var(--acc);color:#fff;border:0}.ed .pbar .rst{background:transparent;color:#cbbfb2;border:1px solid #6b625a;margin-left:auto}
.stdin{width:100%;box-sizing:border-box;font:14px Menlo,monospace;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;min-height:36px}
.out{white-space:pre-wrap;font:14px/1.5 Menlo,monospace;background:#111;color:#d6f5d6;border-radius:10px;padding:10px 12px;margin-top:6px;min-height:20px}
.out .e{color:#ff9a8a}.out .h{color:#ffd479}
.pres{margin-top:6px;font-size:14.5px;padding:8px 12px;border-radius:10px}.pres.ok{background:var(--ok-soft);color:var(--ok)}.pres.no{background:var(--bad-soft)}
.pyex h3 .st{margin-left:auto;font-size:18px}
#load{position:sticky;top:0;z-index:5;background:var(--gold-soft);padding:8px 12px;border-radius:10px;font-size:14px;margin:8px 0}
.pyprog{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pyprog span{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px}.pyprog span.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
details.hint{margin:8px 0}details.hint summary{cursor:pointer;color:var(--acc);font-size:14px}
</style></head><body><div class="w">
<a class="back" href="index.html">← 回到任务</a>
<h1 id="title">Python 练习台</h1>
<div id="load">🐍 正在加载 Python（第一次大约要下载 13MB，请稍等；以后会快很多）……</div>
<div id="main"></div>
</div>
<script>
const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LID = new URLSearchParams(location.search).get('l') || 'py1';
let W, ready = false, pend = {}, seq = 0, T0 = Date.now();
function boot(){
  W = new Worker('py-worker.js');
  W.onmessage = e => { if (e.data.ready){ ready = true; const l = document.getElementById('load'); l.textContent = '✅ Python 准备好了'; setTimeout(() => l.remove(), 1500); return; } const p = pend[e.data.id]; if (p){ clearTimeout(p.t); delete pend[e.data.id]; p.r(e.data); } };
  W.onerror = () => { document.getElementById('load').innerHTML = '❌ Python 加载失败。换个网络再试，或者告诉姐姐。'; };
}
boot();
// 运行一次：5 秒没结束就当死循环，关掉重开
function run(code, stdin, after){
  return new Promise(r => {
    const id = ++seq;
    const t = setTimeout(() => { delete pend[id]; W.terminate(); ready = false; boot(); r({out: '', err: 'TIMEOUT', ok: false}); }, 5000);
    pend[id] = {r, t}; W.postMessage({id, code, stdin, after});
  });
}
// iPad 中文键盘会打出中文标点和弯引号：引号统一换成直的，字符串外面的中文标点换成英文的
function clean(src){
  src = src.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/ /g, ' ');
  const map = {'（':'(', '）':')', '：':':', '，':',', '＝':'=', '［':'[', '］':']', '【':'[', '】':']', '＋':'+', '－':'-', '＊':'*', '／':'/', '＜':'<', '＞':'>', '；':';', '＃':'#', '　':' '};
  let r = '', q = null, cm = false;
  for (let i = 0; i < src.length; i++){
    const c = src[i];
    if (c === '\n'){ cm = false; r += c; continue; }
    if (cm){ r += c; continue; }
    if (q){ r += c; if (c === '\\'){ r += src[++i] || ''; continue; } if (c === q) q = null; continue; }
    if (c === '"' || c === "'"){ q = c; r += c; continue; }
    if (c === '#'){ cm = true; r += c; continue; }
    r += map[c] || c;
  }
  return r;
}
// 把常见报错翻译成大白话
function explain(err){
  if (err === 'TIMEOUT') return '程序跑了 5 秒还没停，可能是<b>死循环</b>（while 的条件一直成立）。';
  if (err.startsWith('CHECK:')) return '检查没通过：' + esc(err.slice(6).trim().split('\n').pop());
  const last = err.trim().split('\n').filter(x => !/^\s*File "<exec>"|^\s*\^|^Traceback/.test(x)).pop() || err;
  const line = (err.match(/File "<exec>", line (\d+)/g) || []).pop(), ln = line ? line.match(/\d+/)[0] : '';
  const H = [
    [/EOFError/, '程序要用 input() 读输入，但输入框里的内容不够。在「程序的输入」框里多写几行。'],
    [/IndentationError|unexpected indent|expected an indented block/, '<b>缩进</b>不对：if、for、def 后面那一行要往里空 4 格；不该空格的地方别空。'],
    [/SyntaxError.*(EOL|unterminated string)/, '<b>引号没配对</b>：文字要用一对英文引号包起来，比如 "你好"。'],
    [/SyntaxError.*'\(' was never closed|never closed/, '<b>括号没配对</b>：数一数 ( 和 ) 是不是一样多。'],
    [/SyntaxError.*expected ':'/, '这一行末尾少了<b>冒号 :</b>（if、for、while、def 后面都要有）。'],
    [/SyntaxError/, '<b>语法错误</b>：检查这一行的拼写、括号、引号、冒号。'],
    [/NameError: name '(.+?)'/, m => `不认识 <b>${esc(m[1])}</b>：是不是拼错了？或者忘了先给它赋值？如果它是文字，要加引号。`],
    [/TypeError: can only concatenate str/, '<b>文字和数字不能直接相加</b>：如果这个值是 input() 拿到的，要先用 int() 变成数字；如果是想把数字拼进句子，用 f"…{变量}…"。'],
    [/TypeError: unsupported operand type.*'str' and 'int'|'int' and 'str'/, '<b>文字不能和数字做加减</b>：input() 得到的是文字，要先用 int() 变成数字。'],
    [/ValueError: invalid literal for int/, 'int() 只能把<b>像数字的文字</b>变成数字，比如 int("15")；int("十五") 就不行。检查输入框。'],
    [/ZeroDivisionError/, '<b>除以 0</b> 了。'],
    [/IndexError/, '<b>下标超出范围</b>：列表有 n 个东西，下标只能是 0 到 n−1。'],
  ];
  for (const [re, h] of H){ const m = last.match(re) || err.match(re); if (m) return (ln ? `第 ${ln} 行：` : '') + (typeof h === 'function' ? h(m) : h) + `<br><small style="opacity:.7">${esc(last)}</small>`; }
  return (ln ? `第 ${ln} 行：` : '') + esc(last);
}
const norm = s => String(s).replace(/[ \t]+$/gm, '').trim();
// 测试：in 输入；has 输出里要出现的内容；eq 输出完全一致；py 运行完以后再执行的检查代码（assert）
async function check(ex, code){
  for (const [k, t] of ex.tests.entries()){
    const r = await run(code, t.in || [], t.py);
    if (!r.ok) return {ok: false, msg: explain(r.err), out: r.out, t};
    const o = norm(r.out);
    if (t.eq != null && o !== norm(t.eq)) return {ok: false, msg: `输出和要求的不一样。`, out: r.out, t, want: t.eq};
    const loose = x => String(x).replace(/\s+/g, '').replace(/，/g, ',').replace(/！/g, '!').replace(/：/g, ':').replace(/？/g, '?');
    for (const h of t.has || []) if (!loose(o).includes(loose(h))) return {ok: false, msg: `输出里应该有「<b>${esc(h)}</b>」，但没找到。`, out: r.out, t};
    for (const h of t.not || []) if (o.includes(h)) return {ok: false, msg: `输出里不应该有「<b>${esc(h)}</b>」。`, out: r.out, t};
  }
  return {ok: true};
}
const ST = () => load('py', {}), saveST = s => save('py', s);
function editor(id, code, opts = {}){
  return `<div class="ed" id="ed-${id}">
  <textarea class="code" id="c-${id}" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" rows="${Math.max(4, code.split('\n').length + 1)}">${esc(code)}</textarea>
  <div class="keys">${['⇥', ':', '(', ')', '"', '=', '+', '[', ']', '{', '}', '#', '_'].map(k => `<button type="button" onclick="key('${id}','${k}')">${k === '"' ? '&quot;' : k}</button>`).join('')}</div>
  ${opts.stdin != null ? `<textarea class="stdin" id="i-${id}" placeholder="程序的输入：每行一个（程序里每个 input() 读一行）" autocapitalize="off" autocorrect="off">${esc(opts.stdin)}</textarea>` : ''}
  <div class="pbar"><button class="run" onclick="tryRun('${id}')">▶ 运行</button>${opts.check ? `<button class="pchk" onclick="submitEx('${id}')">✓ 提交检查</button>` : ''}<button class="rst" onclick="resetEd('${id}')">重置</button></div>
  <div class="out" id="o-${id}" hidden></div><div id="r-${id}"></div></div>`;
}
function key(id, k){
  const ta = document.getElementById('c-' + id), s = ta.selectionStart, e = ta.selectionEnd, ins = k === '⇥' ? '    ' : k === '(' ? '()' : k === '"' ? '""' : k === '[' ? '[]' : k === '{' ? '{}' : k;
  ta.setRangeText(ins, s, e, 'end'); if (['()', '""', '[]', '{}'].includes(ins)) ta.selectionStart = ta.selectionEnd = s + 1; ta.focus(); draftSave(id);
}
function draftSave(id){ const s = ST(); s.draft = s.draft || {}; s.draft[LID + '/' + id] = document.getElementById('c-' + id).value; saveST(s); }
document.addEventListener('keydown', e => {
  const ta = e.target; if (!ta.classList || !ta.classList.contains('code')) return;
  if (e.key === 'Tab'){ e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); }
  if (e.key === 'Enter'){ // 自动缩进：保持上一行的缩进，行末是冒号就多缩 4 格
    const v = ta.value.slice(0, ta.selectionStart), line = v.split('\n').pop(), ind = line.match(/^ */)[0] + (/:\s*$/.test(line) ? '    ' : '');
    e.preventDefault(); ta.setRangeText('\n' + ind, ta.selectionStart, ta.selectionEnd, 'end');
  }
});
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('code')) draftSave(e.target.id.slice(2)); });
const findEx = id => (P.ex || []).find(x => x.id === id), findDemo = id => DEMOS[id];
let P, DEMOS = {};
async function tryRun(id){
  if (!ready) return toast('Python 还在加载，稍等一下');
  const code = clean(document.getElementById('c-' + id).value), si = document.getElementById('i-' + id);
  const o = document.getElementById('o-' + id); o.hidden = false; o.textContent = '运行中……';
  const r = await run(code, si && si.value.trim() ? si.value.replace(/\n+$/, '').split('\n') : []);
  o.innerHTML = esc(r.out) + (r.ok ? '' : `<span class="e">${r.out ? '\n' : ''}❌ 出错了</span>\n<span class="h">${explain(r.err)}</span>`);
  if (!r.out && r.ok) o.innerHTML = '<span class="h">（程序运行完了，但没有输出任何东西。要用 print() 才会显示。）</span>';
}
async function submitEx(id){
  if (!ready) return toast('Python 还在加载，稍等一下');
  const ex = findEx(id), code = clean(document.getElementById('c-' + id).value), box = document.getElementById('r-' + id);
  box.innerHTML = '<div class="pres">检查中……</div>';
  const s = ST(); s[LID] = s[LID] || {}; const rec = s[LID][id] = s[LID][id] || {tries: 0}; rec.tries++;
  const r = await check(ex, code);
  if (r.ok){ rec.ok = true; rec.code = code; saveST(s); box.innerHTML = `<div class="pres ok">✅ 通过！${ex.project ? '你的作品完成了 🎉' : ''}</div>`; paint(); finish(); return; }
  saveST(s);
  const t = r.t || {};
  box.innerHTML = `<div class="pres no">❌ 还没通过（第 ${rec.tries} 次）。${r.msg}${t.in && t.in.length ? `<br>测试用的输入：<code>${t.in.map(esc).join(' / ')}</code>` : ''}${r.want ? `<br>要求输出：<pre style="margin:4px 0">${esc(r.want)}</pre>` : ''}${r.out ? `<br>你的程序输出：<pre style="margin:4px 0">${esc(r.out)}</pre>` : ''}</div>${rec.tries >= 3 && ex.hint ? `<div class="tip">💡 提示：${ex.hint}</div>` : ''}`;
}
function resetEd(id){ const ex = findEx(id), d = findDemo(id), s = ST(); if (s.draft) delete s.draft[LID + '/' + id]; saveST(s); document.getElementById('c-' + id).value = ex ? ex.starter : d; }
function paint(){
  const s = (ST()[LID]) || {};
  document.getElementById('pyprog').innerHTML = '<b style="font-size:13px;color:var(--soft);align-self:center">点一下跳到练习：</b>' + P.ex.map((x, i) => `<a href="#${x.id}" style="text-decoration:none;color:inherit" onclick="event.preventDefault();const el=document.getElementById('${x.id}');window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-10,behavior:'smooth'});history.replaceState(null,'','#${x.id}')"><span class="${s[x.id] && s[x.id].ok ? 'ok' : ''}">${s[x.id] && s[x.id].ok ? '✅' : '⬜️'} ${x.project ? '🎮 作品' : '练习 ' + (i + 1)}</span></a>`).join('');
  P.ex.forEach(x => { const el = document.getElementById('st-' + x.id); if (el) el.textContent = s[x.id] && s[x.id].ok ? '✅' : ''; });
}
// 全部通过：记进 lesson（首页任务自动打勾），推送给姐姐
function finish(){
  const s = ST()[LID] || {}, all = P.ex.every(x => s[x.id] && s[x.id].ok), L = load('lesson', {});
  if (!all || L[LID]) return;
  const tries = P.ex.reduce((a, x) => a + s[x.id].tries, 0), proj = P.ex.find(x => x.project);
  L[LID] = {text: `全部 ${P.ex.length} 题通过，一共提交 ${tries} 次`, time: todayStr() + ' ' + hm(), hit: P.ex.length, total: P.ex.length}; save('lesson', L);
  notify(`🐍 ${P.title}：${P.ex.length} 题全部通过（一共提交 ${tries} 次，约 ${Math.max(1, Math.round((Date.now() - T0) / 60000))} 分钟）` + (proj ? `\n🎮 她的作品代码：\n${s[proj.id].code}` : ''));
  toast('🎉 这一课全部完成！');
}
function render(){
  document.title = P.title; document.getElementById('title').textContent = '🐍 ' + P.title;
  const s = ST(), dr = s.draft || {};
  let h = `<p class="lede">${P.intro}</p><div class="pyprog" id="pyprog"></div><div class="tip">📖 <b>怎么学：</b>从上往下看。先看 01–04 四小节讲解（每段黑色代码框都能点 ▶ 运行，也可以自己改了再运行），看完往下滑就是练习。</div>`;
  let n = 0;
  for (const sec of P.secs){
    const html = sec.html.replace(/<demo>([\s\S]*?)<\/demo>/g, (_, c) => { const id = 'd' + (++n); DEMOS[id] = c.replace(/^\n/, ''); return editor(id, dr[LID + '/' + id] ?? DEMOS[id], {stdin: /input\(/.test(c) ? '' : null}); });
    h += `<div class="sec" id="${sec.id}"><h3><span class="n">${sec.n}</span>${sec.title}</h3>${html}</div>`;
  }
  P.ex.forEach((x, i) => {
    h += `<div class="sec pyex" id="${x.id}"><h3><span class="n">${x.project ? '🎮' : '练习 ' + (i + 1)}</span>${x.title}<span class="st" id="st-${x.id}"></span></h3><div>${x.desc}</div>
    ${editor(x.id, dr[LID + '/' + x.id] ?? x.starter, {stdin: x.stdin ?? null, check: true})}
    ${x.hint ? `<details class="hint"><summary>卡住了？看提示</summary><div class="tip">${x.hint}</div></details>` : ''}</div>`;
  });
  document.getElementById('main').innerHTML = h; paint();
}
const sc = document.createElement('script'); sc.src = `data/py/${LID}.js?v=${Date.now()}`;
sc.onload = () => { P = window.PY; render(); }; sc.onerror = () => { document.getElementById('main').innerHTML = '<p>找不到这一课。</p>'; };
document.body.appendChild(sc);
</script>
</body></html>
