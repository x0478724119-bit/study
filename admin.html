<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="robots" content="noindex">
<title>管理后台</title>
<link rel="stylesheet" href="style.css?v=1792737637">
<style>
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.tabs2 button{width:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 14px}.tabs2 button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px}
input.in,select.in,textarea.in{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.in{min-height:72px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.codes{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.codes span{background:var(--bg);border-radius:10px;padding:6px 12px;font-size:14px}.codes b{font-size:18px;letter-spacing:2px;color:var(--acc)}
.mini{width:auto;padding:7px 12px;font-size:13.5px;margin:4px 6px 0 0}
.lockpage{max-width:460px;margin:40px auto}
.jdone{opacity:1;filter:none;background:var(--bg)}.jdone h3{color:var(--soft)}
</style>
</head><body><div class="w">
<div id="app"></div>
</div>
<script src="common.js?v=1792737637"></script>
<script>
// ===== 管理后台：只有存了 GitHub 钥匙的浏览器能改东西 =====
const REPO = 'x0478724119-bit/study', API = 'https://api.github.com/repos/' + REPO + '/contents/';
const $ = s => document.querySelector(s);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let jQ = '';
let jType = '全部', TOKEN = load('adminToken', ''), SECRET = load('adminSecret', ''), tab = 'jobs', jobs = [], pause = [], leaves = [], adjust = [], editing = null;
const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const sha = {};

async function gh(path, body){
  const r = await fetch(API + path + (body ? '' : '?ref=main&t=' + Date.now()), {method: body ? 'PUT' : 'GET', headers: {Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json'}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error((await r.json()).message || r.status);
  return r.json();
}
async function readJS(path, varName){
  const f = await gh(path); sha[path] = f.sha;
  const txt = b64d(f.content), i = txt.indexOf('window.' + varName + ' = ');
  return JSON.parse(txt.slice(i + varName.length + 10).trim().replace(/;$/, ''));
}
async function writeJS(path, varName, data, header, msg){
  const content = (header ? header + '\n' : '') + 'window.' + varName + ' = ' + JSON.stringify(data, null, 1) + ';\n';
  const r = await gh(path, {message: msg, content: b64e(content), sha: sha[path], branch: 'main'}); sha[path] = r.content.sha;
}

// 验收码：由你的"后台暗号"算出来，暗号只存在这个浏览器里，网站上只放加密后的值
async function codeOf(id, tier){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(SECRET), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(id + ':' + tier)));
  return String(((sig[0] << 24 | sig[1] << 16 | sig[2] << 8 | sig[3]) >>> 0) % 900000 + 100000);
}
async function hashes(id){ return [fnv(await codeOf(id, 'full')), fnv(await codeOf(id, 'ok'))]; }

// ===== 登录（粘贴钥匙）=====
function viewLogin(){
  $('#app').innerHTML = `<div class="lockpage"><h1>🔐 管理后台</h1><p class="s">第一次使用：粘贴你在 GitHub 生成的钥匙，再设一个只有你知道的"后台暗号"（用来生成验收码，记住它）。都只存在这个浏览器里。</p>
    <div class="c"><label>GitHub 钥匙（github_pat_ 开头）</label><input class="in" id="tk" type="password" autocomplete="off">
    <label>后台暗号（字母加数字，至少 6 位，比如拼音 + 数字；别告诉妹妹）</label><input class="in" id="sc" type="password" autocomplete="off" value="${esc(SECRET)}">
    <button class="main" onclick="login()">进入后台</button><p class="s" id="err"></p></div></div>`;
}
async function login(){
  TOKEN = $('#tk').value.trim(); SECRET = $('#sc').value.trim();
  if (SECRET.length < 6){ $('#err').textContent = '暗号至少 6 位'; return; }
  try { await boot(); save('adminToken', TOKEN); save('adminSecret', SECRET); save('isAdmin', true); } catch(e){ $('#err').textContent = '连不上：' + e.message + '（检查钥匙是否复制完整、权限是否选了 Contents 读写）'; }
}
async function boot(){
  [jobs, pause, leaves, adjust] = await Promise.all([readJS('data/jobs.js', 'JOBS'), readJS('data/pause.js', 'PAUSE'), readJS('data/leave.js', 'LEAVE_OK'), readJS('data/adjust.js', 'ADJUST')]);
  // 第一次用暗号：把所有订单的验收码换成暗号算出来的
  let changed = false;
  for (const j of jobs){ const h = await hashes(j.id); if (String(j.h) !== String(h)){ j.h = h; changed = true; } if (!j.pub){ j.pub = todayStr(); changed = true; } }
  if (changed) await saveJobs('验收码改用后台暗号生成');
  render();
}

// ===== 页面 =====
function render(){
  let h = `<div class="row2"><h1>🛠️ 管理后台</h1><a class="go" href="./">打开学习站 →</a></div>
    <div class="tabs2">${[['jobs','📋 订单'],['leave','🙋 请假'],['pause','🏖️ 放假'],['coin','🪙 奖惩'],['set','⚙️ 设置']].map(([k,n]) => `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';editing=null;render()">${n}</button>`).join('')}</div>`;
  h += ({jobs: vJobs, leave: vLeave, pause: vPause, coin: vCoin, set: vSet})[tab]();
  $('#app').innerHTML = h;

}
function vJobs(){
  if (editing !== null) return vEdit();
  const open = jobs.map((j,i) => [j,i]).filter(([j]) => !j.closed).sort((a,b) => (b[0].pub || '').localeCompare(a[0].pub || ''));
  const done = jobs.map((j,i) => [j,i]).filter(([j]) => j.closed).sort((a,b) => b[0].closed.localeCompare(a[0].closed));
  const card = ([j,i]) => `<div class="c ${j.closed ? 'jdone' : ''}"><div class="row2"><span class="tag t-${j.type}">${j.type}</span><b class="reward">🪙 ${j.reward}</b></div>
    <h3 style="margin:6px 0"><span class="jno">${jobNo(j)}</span>${esc(j.title)}</h3>
    <div class="meta"><span>发布 ${(j.pub || '').slice(5)}</span><span>接单后 ${j.days} 天内交</span><span>${'★'.repeat(j.stars)}</span>${j.minLv ? `<span>Lv${j.minLv}</span>` : ''}${j.closed ? `<span>✅ ${j.closed.slice(5)} 验收 · ${j.tier === 'ok' ? '一般' : '满意'}</span>` : ''}</div>
    <div class="codes" id="codes-${j.id}"></div>
    ${j.closed ? `<button class="ghost mini" onclick="showCode('${j.id}','${j.tier}')">再看码</button><button class="ghost mini" onclick="unclose(${i})">撤销验收</button>`
      : `<button class="main mini" onclick="accept(${i},'full')">验收：满意</button><button class="gold mini" onclick="accept(${i},'ok')">验收：一般</button><button class="ghost mini" onclick="editing=${i};render()">修改</button><button class="ghost mini" onclick="delJob(${i})">删除</button>`}</div>`;
  const q = jQ.trim().toLowerCase().replace(/\s+/g, '');
  const f = ([j]) => (jType === '全部' || j.type === jType) && (!q || (jobNo(j) + j.id + j.title).toLowerCase().replace(/\s+/g, '').includes(q));
  const chips = '<div class="chips">' + ['全部','室内','设计','画画','编程','英语'].map(t => `<button class="${jType === t ? 'on' : ''}" onclick="jType='${t}';render()">${t}</button>`).join('') + '</div>';
  return `<input class="fill" id="jq" placeholder="🔍 搜编号或名字，比如 ART-04、图标" value="${esc(jQ)}" oninput="jQ=this.value;render();const e=$('#jq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="margin:8px 0 4px">` + chips + `<p class="s">她把作品发到工作室群后，搜一下编号，点"验收"就会弹出要给她的码。</p><button class="main" onclick="editing='new';render()">＋ 新订单</button>` +
    open.filter(f).map(card).join('') + (done.filter(f).length ? '<h2 style="color:var(--faint)">已验收</h2>' + done.filter(f).map(card).join('') : '');
}
async function showCode(id, tier){ document.getElementById('codes-' + id).innerHTML = `<span>${tier === 'ok' ? '一般码' : '满意码'} <b>${await codeOf(id, tier)}</b>（发给她）</span>`; }
// 验收后直接弹窗显示码，不用往下翻
async function codePop(j, tier){
  const c = await codeOf(j.id, tier);
  let m = document.getElementById('pop'); if (!m){ m = document.createElement('div'); m.id = 'pop'; m.className = 'modal'; document.body.appendChild(m); }
  m.innerHTML = `<div class="box" style="text-align:center"><div class="s">${jobNo(j)} ${esc(j.title)} · ${tier === 'ok' ? '一般' : '满意'}</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:6px;margin:10px 0">${c}</div>
    <button class="main" onclick="navigator.clipboard.writeText('${c}').then(()=>toast('已复制，发给她吧'))">复制验收码</button>
    <button class="ghost" onclick="document.getElementById('pop').classList.remove('show')">关闭</button></div>`;
  m.classList.add('show');
}
async function accept(i, tier){
  const j = jobs[i]; j.closed = todayStr(); j.tier = tier;
  await saveJobs('验收：' + j.title); render(); codePop(j, tier);
}
async function unclose(i){ const j = jobs[i]; delete j.closed; delete j.tier; await saveJobs('撤销验收：' + j.title); render(); }
function vEdit(){
  const j = editing === 'new' ? {type:'设计', title:'', reward:30, days:3, stars:1, client:'姐姐', brief:'', deliver:[], spec:[], accept:[], ref:''} : jobs[editing];
  const L = a => esc((a || []).join('\n'));
  return `<a class="back" href="#" onclick="editing=null;render();return false">← 返回</a><div class="c">
    <label>标题</label><input class="in" id="f-title" value="${esc(j.title)}">
    <div class="grid3"><div><label>类型</label><select class="in" id="f-type">${['室内','设计','画画','编程','英语'].map(t => `<option ${t === j.type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <div><label>报酬（金币）</label><input class="in" id="f-reward" type="number" value="${j.reward}"></div><div><label>接单后几天内交</label><input class="in" id="f-days" type="number" value="${j.days}"></div></div>
    <div class="grid3"><div><label>难度 1–3</label><input class="in" id="f-stars" type="number" min="1" max="3" value="${j.stars}"></div><div><label>需要等级（可空）</label><input class="in" id="f-minLv" type="number" value="${j.minLv || ''}"></div><div><label>甲方</label><input class="in" id="f-client" value="${esc(j.client)}"></div></div>
    <label>需求说明</label><textarea class="in" id="f-brief">${esc(j.brief)}</textarea>
    <label>要交什么（一行一条）</label><textarea class="in" id="f-deliver">${L(j.deliver)}</textarea>
    <label>具体要求（一行一条）</label><textarea class="in" id="f-spec">${L(j.spec)}</textarea>
    <label>验收标准（一行一条）</label><textarea class="in" id="f-accept">${L(j.accept)}</textarea>
    <div class="grid3"><div><label>指定工具（可空，比如 酷家乐）</label><input class="in" id="f-tool" value="${esc(j.tool || '')}"></div><div><label>在网站上写（最少词数，可空）</label><input class="in" id="f-write" type="number" value="${j.write || ''}"></div><div><label>前置课 id（可空，如 d6-plan）</label><input class="in" id="f-pre" value="${esc((j.pre || []).join(','))}"></div></div>
    <label>参考链接（可空，比如 book.html?d=2026-10-16#d6-art）</label><input class="in" id="f-ref" value="${esc(j.ref)}">
    <button class="main" onclick="saveJob()">保存并发布</button><p class="s" id="msg"></p></div>`;
}
async function saveJob(){
  const v = id => $('#f-' + id).value.trim(), lines = id => v(id).split('\n').map(x => x.trim()).filter(Boolean);
  const isNew = editing === 'new';
  const next = Math.max(0, ...jobs.map(x => +(String(x.id).match(/^J(\d+)$/) || [0, 0])[1])) + 1;
  const j = isNew ? {id: 'J' + String(next).padStart(2, '0'), pub: todayStr()} : jobs[editing];
  Object.assign(j, {type: v('type'), title: v('title'), reward: +v('reward'), days: +v('days'), stars: Math.min(3, Math.max(1, +v('stars') || 1)), client: v('client') || '姐姐', brief: v('brief'), deliver: lines('deliver'), spec: lines('spec'), accept: lines('accept'), ref: v('ref')});
  if (v('minLv')) j.minLv = +v('minLv'); else delete j.minLv;
  if (v('tool')) j.tool = v('tool'); else delete j.tool;
  if (v('write')) j.write = +v('write'); else delete j.write;
  if (v('pre')) j.pre = v('pre').split(/[,，\s]+/).filter(Boolean); else delete j.pre;
  if (!j.title || !j.reward){ $('#msg').textContent = '标题和报酬要填'; return; }
  j.h = await hashes(j.id);
  if (isNew) jobs.push(j);
  $('#msg').textContent = '发布中…';
  try { await saveJobs((isNew ? '新订单：' : '修改订单：') + j.title); editing = null; render(); toast('已发布，约 1 分钟后学习站更新'); }
  catch(e){ $('#msg').textContent = '发布失败：' + e.message; }
}
async function delJob(i){ if (!confirm('删除「' + jobs[i].title + '」？她那边已经接了的单也会消失。')) return; const t = jobs[i].title; jobs.splice(i, 1); await saveJobs('删除订单：' + t); render(); toast('已删除'); }
const saveJobs = msg => writeJS('data/jobs.js', 'JOBS', jobs, '// 悬赏单（由管理后台生成）。h = [满意码哈希, 一般码哈希]，验收码由后台暗号算出。', msg);

function vLeave(){
  return `<p class="s">在这里批准的请假：那天不扣金币、不算欠账，<b>不占她每月 2 次的自助请假</b>。</p>
    <div class="c"><div class="grid3"><div><label>从</label><input class="in" type="date" id="lv-f"></div><div><label>到（请一天就选同一天）</label><input class="in" type="date" id="lv-t"></div></div><button class="main" onclick="addLeave()">批准</button></div>` +
    (leaves.length ? '<div class="c">' + leaves.slice().sort().reverse().map(d => `<div class="row2" style="padding:6px 0"><span>${d}</span><button class="ghost mini" onclick="rmLeave('${d}')">撤销</button></div>`).join('') + '</div>' : '<p class="s">还没有批准过请假。</p>');
}
async function addLeave(){
  const f = $('#lv-f').value, t = $('#lv-t').value || f; if (!f || t < f) return toast('日期不对');
  for (let d = new Date(f + 'T12:00'); todayStr(d) <= t; d = new Date(d.getTime() + 864e5)) if (!leaves.includes(todayStr(d))) leaves.push(todayStr(d));
  await writeJS('data/leave.js', 'LEAVE_OK', leaves, '', '批准请假 ' + f + (t !== f ? '~' + t : '')); render(); toast('已批准');
}
async function rmLeave(d){ leaves = leaves.filter(x => x !== d); await writeJS('data/leave.js', 'LEAVE_OK', leaves, '', '撤销请假 ' + d); render(); }

function vPause(){
  return `<p class="s">放假期间：学习站只显示"假期中"，不布置、不打卡、不扣金币、不算欠账。</p>
    <div class="c"><div class="grid3"><div><label>从</label><input class="in" type="date" id="p-f"></div><div><label>到</label><input class="in" type="date" id="p-t"></div><div><label>原因（她能看到）</label><input class="in" id="p-w" placeholder="和姐姐出去玩"></div></div><button class="main" onclick="addPause()">设置放假</button></div>` +
    (pause.length ? '<div class="c">' + pause.map((p,i) => `<div class="row2" style="padding:6px 0"><span>${p.from} ~ ${p.to} · ${esc(p.why)}</span><button class="ghost mini" onclick="rmPause(${i})">取消</button></div>`).join('') + '</div>' : '<p class="s">没有设置放假。</p>');
}
async function addPause(){ const f = $('#p-f').value, t = $('#p-t').value; if (!f || !t || t < f) return toast('日期不对'); pause.push({from: f, to: t, why: $('#p-w').value.trim()}); await writeJS('data/pause.js', 'PAUSE', pause, '', '放假 ' + f + '~' + t); render(); toast('已设置'); }
async function rmPause(i){ pause.splice(i, 1); await writeJS('data/pause.js', 'PAUSE', pause, '', '取消放假'); render(); }

function vCoin(){
  return `<p class="s">给她发奖励或扣金币。她下次打开学习站时自动到账，每条只生效一次。</p>
    <div class="c"><div class="grid3"><div><label>金币（扣就写负数）</label><input class="in" type="number" id="c-n" value="10"></div><div style="grid-column:span 2"><label>原因（她能看到）</label><input class="in" id="c-w" placeholder="速写画得特别好"></div></div><button class="main" onclick="addAdj()">发出</button></div>` +
    (adjust.length ? '<div class="c">' + adjust.slice().reverse().map(a => `<div class="log"><span>${esc(a.why)}<br><small>${a.date}</small></span><b class="${a.n > 0 ? 'plus' : ''}">${a.n > 0 ? '+' : ''}${a.n}</b></div>`).join('') + '</div>' : '');
}
async function addAdj(){ const n = +$('#c-n').value, w = $('#c-w').value.trim(); if (!n || !w) return toast('金币和原因都要填'); adjust.push({id: Date.now().toString(36), n, why: w, date: todayStr()}); await writeJS('data/adjust.js', 'ADJUST', adjust, '', '金币奖惩'); render(); toast('已发出'); }

function vSet(){
  return `<div class="c"><b>当前状态</b><p class="s">钥匙和暗号都存在这台电脑的浏览器里。换电脑或清了浏览器数据，要重新输入（暗号要和原来一样，否则验收码会变）。</p>
    <button class="ghost" onclick="if(confirm('退出后需要重新粘贴钥匙')){save('adminToken','');location.reload()}">退出后台</button></div>`;
}

TOKEN ? boot().catch(() => viewLogin()) : viewLogin();
</script></body></html>
