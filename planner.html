<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<script src="common.js?v=1793174405"></script>
<link rel="stylesheet" href="style.css?v=1793174405">
<style>
.room-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}.room-in input,.room-in select{width:70px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.room-in select{width:auto}
#stage{width:100%;touch-action:none;background:#fff;border-radius:12px;border:1px solid var(--line);display:block}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pal button{width:auto;padding:7px 10px;font-size:13.5px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-weight:500}
.pal small{color:var(--faint)}
.tools{display:flex;gap:6px;margin:8px 0}.tools button{flex:1;padding:10px;font-size:14px}
.warns{font-size:14px}.warns div{padding:4px 0}
.mode{display:flex;gap:6px;margin:10px 0 8px}.mode button{flex:1;padding:10px;font-size:15px;background:var(--card);border:1px solid var(--line);color:var(--ink)}.mode button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#v3{display:none}#v3 canvas{width:100%;height:62vh;max-height:560px;display:block;border-radius:12px;touch-action:none;background:#f3efe9}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.sw button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.row3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;margin:4px 0}.row3 button{width:auto;padding:7px 12px;font-size:13.5px;background:var(--card);border:1px solid var(--line);color:var(--ink)}.row3 button.on{background:var(--ink);color:var(--bg)}
.shot{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:16px}.shot img{max-width:100%;max-height:75vh;border-radius:10px}.shot p{color:#fff;font-size:14px}
</style>
</head><body><div class="w">
<a class="back" href="javascript:history.back()">← 返回</a>
<h1>📐 户型练习台</h1>
<p class="s">先在「平面图」里按真实尺寸摆家具（每格 0.5 米），会自动检查家具重叠、通道不到 0.6 米、挡住开门。再切到「3D 效果」转着看、改颜色、换灯光、截图。</p>
<div class="c">
  <div class="room-in">房间 <input id="rw" type="number" step="0.1" min="2" max="15"> 米 × <input id="rl" type="number" step="0.1" min="2" max="15"> 米
  · 门在 <select id="door"><option value="b">下墙左边</option><option value="t">上墙左边</option><option value="l">左墙下边</option><option value="r">右墙下边</option></select></div>
</div>
<div class="mode"><button id="m2" class="on" onclick="setMode(2)">📐 平面图</button><button id="m3" onclick="setMode(3)">🧊 3D 效果</button></div>
<svg id="stage"></svg>
<div id="v3"><canvas id="c3"></canvas>
  <p class="s" style="margin:6px 0">按住家具拖：移动家具 · 按住空地拖：转着看 · 两根手指捏合：放大缩小 · 点家具：选中，可以改颜色、旋转、删除</p>
  <div class="c">
    <div class="row3">改颜色：<button data-tg="wall" class="on" onclick="setTarget('wall')">墙</button><button data-tg="floor" onclick="setTarget('floor')">地板</button><button data-tg="item" onclick="setTarget('item')">选中的家具</button></div>
    <div class="sw" id="sw"></div>
    <div class="row3">灯光：<button data-lt="warm" onclick="setLight('warm')">暖光</button><button data-lt="neutral" onclick="setLight('neutral')">自然光</button><button data-lt="cool" onclick="setLight('cool')">冷光</button></div>
    <button class="main" onclick="shot()">📸 截图当效果图</button>
  </div>
</div>
<div class="shot" id="shotbox" onclick="this.style.display='none'"><img id="shotimg"><p>长按图片保存到相册 · 点空白处关闭</p></div>
<div class="tools" id="tools2"><button class="ghost" onclick="rot()">↻ 旋转</button><button class="ghost" onclick="del()">🗑 删除</button><button class="ghost" onclick="if(confirm('清空所有家具？')){S.items=[];sel=-1;draw()}">清空</button></div>
<div class="c"><b>加家具</b>（宽 × 深，米）
  <div class="pal" id="pal"></div></div>
<div class="c warns" id="warns"></div>
</div>
<script>
// 尺寸单位：米。家具 {n 名字, x, y 左上角, w 宽, h 深}
const FURN = [
  ['双人床', 1.5, 2.0], ['单人床', 1.2, 2.0], ['床头柜', 0.45, 0.4], ['衣柜', 1.2, 0.6], ['书桌', 1.2, 0.6], ['椅子', 0.5, 0.5],
  ['书架', 0.8, 0.3], ['沙发', 1.8, 0.85], ['茶几', 1.0, 0.5], ['梳妆台', 1.0, 0.45],
  ['点单台', 2.0, 0.6], ['两人桌', 0.7, 0.7], ['四人桌', 1.2, 0.8], ['吧台', 2.4, 0.5], ['拍照墙', 1.5, 0.2], ['冰箱', 0.7, 0.7],
];
const COLORS = ['#fbe6df', '#e1ebf7', '#ece5f7', '#dff2e8', '#fdf0d6'];
let S = Object.assign({w: 4, l: 3.5, door: 'b', items: [], wall: '#f3ede4', floor: '#c8a27a', light: 'warm'}, load('planner', null) || {}), sel = -1;
const svg = document.getElementById('stage'), PAD = 0.3;
const $i = id => document.getElementById(id);
$i('rw').value = S.w; $i('rl').value = S.l; $i('door').value = S.door;
['rw', 'rl', 'door'].forEach(id => $i(id).onchange = () => { S.w = Math.max(2, +$i('rw').value || 4); S.l = Math.max(2, +$i('rl').value || 3.5); S.door = $i('door').value; draw(); });
$i('pal').innerHTML = FURN.map(([n, w, h], k) => `<button onclick="add(${k})">${n} <small>${w}×${h}</small></button>`).join('');

function add(k){ const [n, w, h] = FURN[k]; S.items.push({n, w, h, x: Math.max(0, (S.w - w) / 2), y: Math.max(0, (S.l - h) / 2)}); sel = S.items.length - 1; draw(); }
function rot(){ const it = S.items[sel]; if (!it) return toast('先点一件家具'); [it.w, it.h] = [it.h, it.w]; clamp(it); draw(); }
function del(){ if (sel < 0) return toast('先点一件家具'); S.items.splice(sel, 1); sel = -1; draw(); }
function clamp(it){ it.x = Math.min(Math.max(0, it.x), S.w - it.w); it.y = Math.min(Math.max(0, it.y), S.l - it.h); }
const snap = v => Math.round(v * 20) / 20;  // 5 厘米

// 门：宽 0.9 米，开门要留一个 0.9 米的扇形空间
function doorBox(){
  const d = 0.9, m = 0.15;
  return {b: {x: m, y: S.l - d, w: d, h: d}, t: {x: m, y: 0, w: d, h: d}, l: {x: 0, y: S.l - m - d, w: d, h: d}, r: {x: S.w - d, y: S.l - m - d, w: d, h: d}}[S.door];
}
// 两个矩形之间的距离（重叠为负）
function gap(a, b){
  const dx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w)), dy = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h));
  return {dx, dy, overlap: dx < -0.001 && dy < -0.001};
}
function check(){
  const bad = new Set(), msgs = [], it = S.items, D = doorBox();
  for (let i = 0; i < it.length; i++){
    if (gap(it[i], D).overlap){ bad.add(i); msgs.push(`🚪 ${it[i].n} 挡住开门了`); }
    for (let j = i + 1; j < it.length; j++){
      const g = gap(it[i], it[j]);
      if (g.overlap){ bad.add(i); bad.add(j); msgs.push(`❌ ${it[i].n} 和 ${it[j].n} 重叠了`); continue; }
      // 正对着、中间有缝但不到 0.6 米 → 人过不去
      const side = (g.dx > 0.05 && g.dx < 0.6 && g.dy < 0) ? g.dx : (g.dy > 0.05 && g.dy < 0.6 && g.dx < 0) ? g.dy : 0;
      if (side && !/椅子|床头柜/.test(it[i].n + it[j].n)){ bad.add(i); bad.add(j); msgs.push(`⚠️ ${it[i].n} 和 ${it[j].n} 之间只有 ${Math.round(side * 100)} 厘米，人走不过去（至少 60）`); }
    }
  }
  return {bad, msgs};
}
function draw(){
  save('planner', S);
  const W = S.w + PAD * 2, H = S.l + PAD * 2;
  svg.setAttribute('viewBox', `${-PAD} ${-PAD} ${W} ${H}`);
  const {bad, msgs} = check(), D = doorBox();
  let g = '';
  for (let x = 0; x <= S.w + 1e-6; x += 0.5) g += `<line x1="${x}" y1="0" x2="${x}" y2="${S.l}" stroke="#eee" stroke-width="0.01"/>`;
  for (let y = 0; y <= S.l + 1e-6; y += 0.5) g += `<line x1="0" y1="${y}" x2="${S.w}" y2="${y}" stroke="#eee" stroke-width="0.01"/>`;
  g += `<rect x="0" y="0" width="${S.w}" height="${S.l}" fill="none" stroke="#2b2622" stroke-width="0.08"/>`;
  // 门：断开墙 + 开门弧线
  const dw = 0.9, arc = {b: `M${D.x} ${S.l} A${dw} ${dw} 0 0 1 ${D.x + dw} ${S.l - dw}`, t: `M${D.x} 0 A${dw} ${dw} 0 0 0 ${D.x + dw} ${dw}`, l: `M0 ${D.y + dw} A${dw} ${dw} 0 0 0 ${dw} ${D.y}`, r: `M${S.w} ${D.y + dw} A${dw} ${dw} 0 0 1 ${S.w - dw} ${D.y}`}[S.door];
  const gapLine = {b: [D.x, S.l, D.x + dw, S.l], t: [D.x, 0, D.x + dw, 0], l: [0, D.y, 0, D.y + dw], r: [S.w, D.y, S.w, D.y + dw]}[S.door];
  g += `<line x1="${gapLine[0]}" y1="${gapLine[1]}" x2="${gapLine[2]}" y2="${gapLine[3]}" stroke="#fff" stroke-width="0.1"/><path d="${arc}" fill="none" stroke="#8a7f74" stroke-width="0.02" stroke-dasharray="0.05 0.04"/>`;
  g += `<text x="${S.w / 2}" y="-0.08" font-size="0.16" text-anchor="middle" fill="#5b524a">${Math.round(S.w * 1000)}</text><text x="${S.w + 0.08}" y="${S.l / 2}" font-size="0.16" fill="#5b524a" transform="rotate(90 ${S.w + 0.08} ${S.l / 2})" text-anchor="middle">${Math.round(S.l * 1000)}</text>`;
  S.items.forEach((it, i) => {
    const fs = Math.min(0.16, it.w / (it.n.length + 1), it.h / 2.2);
    g += `<g data-i="${i}"><rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="${bad.has(i) ? '#fbe9e4' : COLORS[i % COLORS.length]}" stroke="${i === sel ? '#e07a5f' : bad.has(i) ? '#c4553d' : '#2b2622'}" stroke-width="${i === sel ? 0.05 : 0.02}"/>
      <text x="${it.x + it.w / 2}" y="${it.y + it.h / 2 + fs / 3}" font-size="${fs}" text-anchor="middle" fill="#2b2622" pointer-events="none">${it.n}</text></g>`;
  });
  svg.innerHTML = g;
  const it = S.items[sel];
  $i('warns').innerHTML = (it ? `<div>选中：<b>${it.n}</b> ${Math.round(it.w * 100)} × ${Math.round(it.h * 100)} 厘米，离左墙 ${Math.round(it.x * 100)}、离上墙 ${Math.round(it.y * 100)} 厘米</div>` : '<div class="s" style="margin:0">点一件家具可以选中它</div>') +
    (msgs.length ? msgs.map(m => `<div>${m}</div>`).join('') : S.items.length ? '<div style="color:var(--ok)">✅ 没有重叠，通道都够宽，门也开得开</div>' : '');
  if (typeof mode !== 'undefined' && mode === 3 && R) build3d();
}
// 拖动（手指、鼠标都行）
let drag = null;
function pt(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', e => {
  const g = e.target.closest('g[data-i]'); if (!g){ sel = -1; draw(); return; }
  sel = +g.dataset.i; const p = pt(e), it = S.items[sel]; drag = {dx: p.x - it.x, dy: p.y - it.y};
  svg.setPointerCapture(e.pointerId); draw();
});
svg.addEventListener('pointermove', e => { if (!drag || sel < 0) return; const p = pt(e), it = S.items[sel]; it.x = snap(p.x - drag.dx); it.y = snap(p.y - drag.dy); clamp(it); draw(); });
svg.addEventListener('pointerup', () => { drag = null; });
draw();
</script>
<script src="vendor/three.min.js"></script>
<script>
// ===== 3D 效果：把平面图立起来（家具是简化的方块造型）=====
const SWATCH = ['#ffffff', '#f3ede4', '#e8dccb', '#d9c3a5', '#c8a27a', '#9b7653', '#6b4f3a', '#3d3a36', '#8a8f94', '#c9d3d9', '#a9c4d8', '#5e7f99', '#b9cdb0', '#7d9a6f', '#f2c6c2', '#d98b7e', '#e8b04b', '#2b2622'];
const HGT = {'双人床': .45, '单人床': .45, '床头柜': .5, '衣柜': 2.0, '书桌': .75, '椅子': .45, '书架': 1.8, '沙发': .42, '茶几': .4, '梳妆台': .75, '点单台': 1.05, '两人桌': .75, '四人桌': .75, '吧台': 1.05, '拍照墙': 2.2, '冰箱': 1.8};
const DEFC = {'双人床': '#ffffff', '单人床': '#ffffff', '衣柜': '#e8dccb', '书桌': '#c8a27a', '椅子': '#9b7653', '床头柜': '#c8a27a', '书架': '#d9c3a5', '沙发': '#8a8f94', '茶几': '#9b7653', '梳妆台': '#e8dccb', '点单台': '#ffffff', '两人桌': '#c8a27a', '四人桌': '#c8a27a', '吧台': '#9b7653', '拍照墙': '#f2c6c2', '冰箱': '#c9d3d9'};
const LIGHTS = {warm: 0xffd6a0, neutral: 0xfff6ea, cool: 0xdbe8ff};
let mode = 2, target = 'wall', R, scene, cam, walls = [], picks = [], view = {th: 0.8, ph: 0.95, r: 0};
const c3 = document.getElementById('c3');
document.getElementById('sw').innerHTML = SWATCH.map(c => `<button style="background:${c}" onclick="paint('${c}')"></button>`).join('');

function setMode(m){
  mode = m; $i('m2').classList.toggle('on', m === 2); $i('m3').classList.toggle('on', m === 3);
  svg.style.display = m === 2 ? '' : 'none';
  $i('v3').style.display = m === 3 ? 'block' : 'none';
  if (m === 3){ if (!window.THREE){ toast('3D 引擎没加载出来，检查网络后刷新'); return; } build3d(); }
}
function setTarget(t){ target = t; document.querySelectorAll('[data-tg]').forEach(b => b.classList.toggle('on', b.dataset.tg === t)); if (t === 'item' && sel < 0) toast('先在 3D 里点一下要改的家具'); }
function setLight(l){ S.light = l; save('planner', S); build3d(); }
function paint(c){
  if (target === 'wall') S.wall = c; else if (target === 'floor') S.floor = c;
  else { const it = S.items[sel]; if (!it) return toast('先点一下要改的家具'); it.c = c; }
  save('planner', S); build3d();
}
function mat(c, rough = 0.85){ return new THREE.MeshStandardMaterial({color: c, roughness: rough}); }
function box(w, h, d, c, x, y, z, rough){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, rough)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }

function build3d(){
  const W = c3.clientWidth, H = c3.clientHeight;
  if (!R){
    R = new THREE.WebGLRenderer({canvas: c3, antialias: true, preserveDrawingBuffer: true});
    R.setPixelRatio(Math.min(2, devicePixelRatio)); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
    R.outputEncoding = THREE.sRGBEncoding;
    cam = new THREE.PerspectiveCamera(50, 1, 0.05, 100);
    bindOrbit();
  }
  R.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix();
  scene = new THREE.Scene(); scene.background = new THREE.Color('#f3efe9'); walls = []; picks = [];
  const w = S.w, l = S.l, WH = 2.6, T = 0.1, lc = LIGHTS[S.light] || LIGHTS.warm;
  document.querySelectorAll('[data-lt]').forEach(b => b.classList.toggle('on', b.dataset.lt === S.light));
  // 灯：环境光 + 天花板的灯（有阴影）
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5a4a, 0.32));
  const pl = new THREE.PointLight(lc, 0.75, 0, 1.4); pl.position.set(0, WH - 0.15, 0); pl.castShadow = true; pl.shadow.mapSize.set(1024, 1024); pl.shadow.bias = -0.002; scene.add(pl);
  const sun = new THREE.DirectionalLight(lc, 0.22); sun.position.set(w, 4, l); scene.add(sun);
  scene.add(box(0.3, 0.04, 0.3, '#ffffff', 0, WH - 0.02, 0));
  // 地板
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(w, l), mat(S.floor, 0.7)); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
  // 墙（离镜头近的那面会自动隐藏，免得挡住）
  const addWall = (ww, x, z, ry, nx, nz) => { const m = box(ww, WH, T, S.wall, x, WH / 2, z); m.rotation.y = ry; m.userData.n = [nx, nz]; m.userData.p = [x, z]; scene.add(m); walls.push(m); };
  addWall(w + 2 * T, 0, -l / 2 - T / 2, 0, 0, 1); addWall(w + 2 * T, 0, l / 2 + T / 2, 0, 0, -1);
  addWall(l, -w / 2 - T / 2, 0, Math.PI / 2, 1, 0); addWall(l, w / 2 + T / 2, 0, Math.PI / 2, -1, 0);
  // 门（画在墙上）
  const D = doorBox(), dm = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.05, 0.04), mat('#8a6a4f', 0.6));
  if (S.door === 'b') dm.position.set(D.x + 0.45 - w / 2, 1.025, l / 2 + 0.01);
  if (S.door === 't') dm.position.set(D.x + 0.45 - w / 2, 1.025, -l / 2 - 0.01);
  if (S.door === 'l'){ dm.position.set(-w / 2 - 0.01, 1.025, D.y + 0.45 - l / 2); dm.rotation.y = Math.PI / 2; }
  if (S.door === 'r'){ dm.position.set(w / 2 + 0.01, 1.025, D.y + 0.45 - l / 2); dm.rotation.y = Math.PI / 2; }
  scene.add(dm); walls.push(Object.assign(dm, {userData: {n: S.door === 'b' ? [0, -1] : S.door === 't' ? [0, 1] : S.door === 'l' ? [1, 0] : [-1, 0], p: [dm.position.x, dm.position.z]}}));
  // 家具
  S.items.forEach((it, i) => { const g = furn(it, i === sel); g.position.set(it.x + it.w / 2 - w / 2, 0, it.y + it.h / 2 - l / 2); g.traverse(o => { if (o.isMesh) o.userData.i = i; }); scene.add(g); picks.push(g); });
  if (!view.r) view.r = Math.max(w, l) * 1.35 + 1.2;
  render3();
}
// 靠墙的那一边（床头、椅背、沙发靠背放这边）
function wallSide(it){
  const d = {t: it.y, b: S.l - (it.y + it.h), l: it.x, r: S.w - (it.x + it.w)};
  const long = it.w >= it.h ? ['t', 'b'] : ['l', 'r'], short = it.w >= it.h ? ['l', 'r'] : ['t', 'b'];
  return (/床/.test(it.n) ? short : long).sort((a, b) => d[a] - d[b])[0];
}
function furn(it, on){
  const g = new THREE.Group(), w = it.w, d = it.h, h = HGT[it.n] || 0.75, c = it.c || DEFC[it.n] || '#d9c3a5';
  const side = wallSide(it), off = {t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0]}[side];
  const back = (thick, bh, bc) => { const horiz = off[1] !== 0; return box(horiz ? w : thick, bh, horiz ? thick : d, bc, off[0] * (w / 2 - thick / 2), bh / 2, off[1] * (d / 2 - thick / 2)); };
  if (/床/.test(it.n) && it.n !== '床头柜'){
    g.add(box(w, 0.3, d, '#c8a27a', 0, 0.15, 0)); g.add(box(w - 0.04, 0.18, d - 0.04, c, 0, 0.39, 0, 1));
    g.add(back(0.08, 1.0, '#9b7653'));
    const ph = off[1] !== 0; g.add(box(ph ? w * 0.8 : 0.35, 0.1, ph ? 0.35 : d * 0.8, '#f3ede4', off[0] * (w / 2 - 0.3), 0.52, off[1] * (d / 2 - 0.3), 1));
  } else if (it.n === '椅子'){
    g.add(box(w, 0.06, d, c, 0, h, 0)); [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => g.add(box(0.04, h, 0.04, '#3d3a36', a * (w / 2 - 0.04), h / 2, b * (d / 2 - 0.04))));
